<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<title>Ponteiro</title>
<meta http-equiv="refresh" content="2; url=semana/">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F2F2F7;color:#86868B;font:16px system-ui,-apple-system,sans-serif}</style>
</head>
<body>
<p>Abrindo o Ponteiro…</p>
<script>
/* O app agora mora em semana/ (Diário, Semana e Hábitos). Remove o service worker antigo da raiz e redireciona. */
(async () => {
  try {
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      const root = new URL("./", location.href).href;
      await Promise.all(regs.filter(r => r.scope === root).map(r => r.unregister()));
    }
    if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.filter(k => k.startsWith("ponteiro-") || k.startsWith("tempo-")).map(k => caches.delete(k))); }
  } catch (e) { /* ok */ }
  location.replace("semana/");
})();
</script>
</body>
</html>
