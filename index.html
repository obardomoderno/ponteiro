<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B7A75">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ponteiro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Ponteiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: uma coluna de app (máx. 560px), cabeçalho fixo no topo, abas fixas embaixo; editores abrem em tela cheia por cima. */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --sunk:#E3E9EC; --ink:#122027; --muted:#56666F; --line:#D3DCE0;
  --accent:#0B7A75; --accent-ink:#FFFFFF; --accent-soft:#D5ECEA;
  --good:#2E7D32; --warn:#B26A00; --bad:#C0392B; --untracked:#B9C4CA;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body:"Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(18,32,39,.06),0 4px 14px rgba(18,32,39,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1417; --surface:#172126; --sunk:#111A1E; --ink:#E4ECEF; --muted:#93A3AB; --line:#26343B;
  --accent:#3FC1B8; --accent-ink:#06211F; --accent-soft:#163A38;
  --good:#6CC070; --warn:#E3A44A; --bad:#EF7B6E; --untracked:#3A4A52;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1417; --surface:#172126; --sunk:#111A1E; --ink:#E4ECEF; --muted:#93A3AB; --line:#26343B;
  --accent:#3FC1B8; --accent-ink:#06211F; --accent-soft:#163A38;
  --good:#6CC070; --warn:#E3A44A; --bad:#EF7B6E; --untracked:#3A4A52;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
/* campos com 16px ou mais: o iPhone não amplia a tela ao tocar neles */
input,select,textarea{font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.em{font-family:var(--emoji);line-height:1}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:8px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px}
.sub{color:var(--muted);font-size:13px}
main{flex:1;padding-block:4px 110px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.section{display:flex;flex-direction:column;gap:10px}
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
nav.tabs button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);min-width:0}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;flex:none;color:var(--ink)}
.iconbtn.sm{width:30px;height:30px}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.sm svg{width:15px;height:15px}

.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pnav .lbl{font-family:var(--display);font-weight:600;font-size:17px;text-align:center;flex:1;min-width:0}

.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.live{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.chip.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
.chip.ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.chip.no{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.chip.mid{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.chip.live::before{animation:none}}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:16px;font-size:14px;text-align:center}
.small{font-size:13px;color:var(--muted);max-width:65ch}

/* atividade em andamento: o cartão inteiro abre o comentário */
.runlist{display:flex;flex-direction:column;gap:10px}
.run{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border-left:4px solid var(--c);cursor:pointer;display:flex;flex-direction:column}
.run .main{padding:14px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:color-mix(in srgb,var(--c) 22%,var(--surface));flex:none;grid-row:1 / span 3}
.run .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run .grp{color:var(--muted);font-size:12px;font-weight:400}
.run .clock{font-family:var(--mono);font-size:28px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.run.paused .clock{color:var(--muted)}
.run .acts{grid-row:1 / span 3;grid-column:3;display:flex;flex-direction:column;gap:8px}
.run .cm{font-size:13px;color:var(--muted);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.run .cm.has{color:var(--ink)}
.regs{border-top:1px solid var(--line);display:flex;flex-direction:column}
.reg{display:grid;grid-template-columns:auto 1fr auto auto;gap:2px 10px;align-items:center;padding:9px 14px 9px 18px;border-top:1px solid var(--line);cursor:pointer}
.reg:first-child{border-top:0}
.reg .rc{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums}
.reg.paused .rc{color:var(--muted)}
.reg .rt{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.reg .rt.has{color:var(--ink)}
.reg .tag{width:8px;height:8px;border-radius:50%;background:var(--c)}
.regbar{display:flex;justify-content:flex-start;padding:8px 14px 12px;border-top:1px solid var(--line)}

/* grade de tipos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.tile .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--c) 24%,var(--surface));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 70%,transparent)}
.tile .t{font-size:13px;font-weight:700;line-height:1.2;max-width:100%;overflow-wrap:break-word;hyphens:auto}
.tile .d{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.on{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 45%,transparent)}
.tile.group .ic{border-radius:12px}
.tile .badge{position:absolute;top:6px;right:8px;font-size:11px;color:var(--muted);font-weight:700}
.groupbox{grid-column:1 / -1;background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px}
.groupbox .grid{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}

/* histórico */
.dayline{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px 10px;display:flex;flex-direction:column;gap:8px}
.strip{position:relative;height:30px;background:var(--sunk);border-radius:8px;overflow:hidden}
.strip i{position:absolute;top:0;bottom:0;background:var(--c);opacity:.9;min-width:2px}
.strip i.ov{top:50%}
.ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted)}
.kv{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.kv b{font-family:var(--mono);color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.item:first-child{border-top:0}
.item .dot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 24%,var(--surface));font-size:15px;grid-row:1 / span 2}
.item .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tm{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;grid-column:2}
.item .du{font-family:var(--mono);font-variant-numeric:tabular-nums;grid-row:1 / span 2;grid-column:3;text-align:right}
.item .cm{grid-column:2 / span 2;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item.indent{padding-left:38px}
.item.regrow{padding-left:30px;background:color-mix(in srgb,var(--sunk) 45%,transparent)}
.item.regrow .dot{width:22px;height:22px;border-radius:50%;font-size:11px}

/* gráficos */
.chartcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:14px;align-items:center}
.donut{width:min(240px,70vw);max-width:100%;aspect-ratio:1}
.donut text{fill:var(--ink);font-family:var(--mono)}
.donut .lbl{fill:var(--muted);font-family:var(--body);font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.bars{width:100%;max-width:100%}
.bars text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.bars line{stroke:var(--line)}
.srow{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.srow:first-child{border-top:0}
.srow .sw{width:12px;height:12px;border-radius:4px;background:var(--c)}
.srow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.srow.child .nm{font-weight:400;padding-left:14px}
.srow .du{font-family:var(--mono);font-variant-numeric:tabular-nums}
.srow .pc{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);width:48px;text-align:right}
.srow .bar{grid-column:2 / -1;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.srow .bar span{display:block;height:100%;background:var(--c)}

/* grupos de ações */
.lcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;width:100%;border:0;text-align:left}
.lcard .ico{grid-row:1 / span 2;--c:var(--accent)}
.lcard .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.lcard .pct{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;grid-row:1 / span 2;grid-column:3}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;position:relative}
.meter span{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px;transition:width .25s}
.meter.done span{background:var(--good)}
.lcard .meta{grid-column:2;display:flex;flex-direction:column;gap:6px;min-width:0}
.checks{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;touch-action:pan-y}
.ck{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:12px 10px 12px 14px;border-top:1px solid var(--line);background:var(--surface);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
.ck:first-child{border-top:0}
.ck .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface)}
.ck .box svg{width:16px;height:16px;stroke:var(--accent-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ck.on .box{background:var(--accent);border-color:var(--accent)}
.ck.on .box svg{opacity:1}
.ck .tx{min-width:0;overflow-wrap:anywhere}
.ck.on .tx{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.ck .grip{width:30px;height:30px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;background:none;border:0}
.ck .grip svg{width:18px;height:18px;fill:currentColor}
.ck.dragging{position:relative;z-index:2;box-shadow:0 10px 24px rgba(0,0,0,.18);transform:scale(1.02);border-radius:10px;cursor:grabbing}
.ck.pressing{background:var(--sunk)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink);font-size:16px}
.bigpct{display:flex;align-items:baseline;gap:10px}
.bigpct b{font-family:var(--mono);font-size:44px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.titlein{font-family:var(--display);font-size:24px;font-weight:700;background:none;border:0;border-bottom:1px dashed var(--line);padding:4px 0;width:100%;color:var(--ink);min-width:0}

/* ajustes */
.form{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.field:first-child{border-top:0}
.field .l{font-weight:700}
.field .h{font-size:12px;color:var(--muted);flex-basis:100%;margin-top:-6px}
.field .seg{min-width:min(260px,100%)}

/* telas cheias (editores) */
.fs{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.fsbar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.fsbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-block:10px}
.fsbar .in > :first-child{justify-self:start}
.fsbar .in > :last-child{justify-self:end}
.fsbar h3{font-family:var(--display);font-size:17px;margin:0;font-weight:700;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52vw}
.fsbody{max-width:560px;margin:0 auto;padding-block:18px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.fsbody label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.fsbody input[type=text],.fsbody input[type=search],.fsbody input[type=number],.fsbody input[type=password],.fsbody input[type=datetime-local],.fsbody select,.fsbody textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-weight:400;font-size:16px;color:var(--ink);width:100%;min-width:0}
.fsbody textarea.note{min-height:min(55vh,420px);font-size:17px;line-height:1.5;resize:vertical}
.ctx{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);border-left:4px solid var(--c)}
.ctx .ico{grid-row:auto}
.ctx .t{font-weight:700}
.ctx .s{font-family:var(--mono);font-size:13px;color:var(--muted)}
.regctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.rbig{font-family:var(--mono);font-size:36px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em;flex:1 1 100%;line-height:1.1}
.rbig.paused{color:var(--muted)}
.regctl .btn{flex:1 1 0;padding-block:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf{display:flex;flex-direction:column;gap:6px}
.tf > label{font-size:13px;font-weight:700;color:var(--muted)}
.tfrow{display:flex;gap:8px;align-items:stretch}
.tfrow input{flex:1}
.tfrow .btn{flex:none;padding-inline:16px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;background:var(--c)}
.swatches button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--bg)}
.iconpick{display:flex;align-items:center;gap:14px}
.iconpick .cur{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:34px;background:color-mix(in srgb,var(--c) 24%,var(--surface));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 70%,transparent)}

textarea.out{font-family:var(--mono);font-size:16px;min-height:240px}

.epick-top{position:sticky;top:calc(57px + env(safe-area-inset-top,0px));z-index:1;background:var(--bg);display:flex;flex-direction:column;gap:10px;padding-block:12px 8px}
.ecats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ecats::-webkit-scrollbar{display:none}
.ecats button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.ecats button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:2px}
.egrid button{height:46px;border:0;border-radius:10px;background:none;font-size:28px;font-family:var(--emoji);line-height:1;padding:0}
.egrid button:hover,.egrid button:focus-visible{background:var(--sunk)}
.egrid button[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.ehead{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 0 6px;scroll-margin-top:calc(150px + env(safe-area-inset-top,0px))}
.typeemoji{display:flex;gap:8px;align-items:center}
.typeemoji input{flex:1;font-size:22px!important;font-family:var(--emoji)}
.typeemoji input::placeholder{font-size:15px;font-family:var(--body)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.loading{color:var(--muted);text-align:center;padding:40px 0}

/* ---------- armazenamento: conta (db do artefato) com cópia no aparelho para uso offline ---------- */
const Store = { mode: "boot", col: null, uid: null, dirty: new Set(), pending: new Set(), timer: null, ready: false, flushing: false, again: false, retry: 0, rt: null, hadTrouble: false };
const LS_KEY = "ponteiro.v1";
const cacheKey = () => "ponteiro.cache." + Store.uid;
function markDirty(k) { Store.dirty.add(k); clearTimeout(Store.timer); Store.timer = setTimeout(flush, 600); updateSync(); }
function markApp() { markDirty("app"); }
function appBody() { return { types: S.types, lists: S.lists, settings: S.settings, running: S.running, example: S.example, v: 2 }; }
function saveCache() {
  try {
    if (Store.mode === "db") localStorage.setItem(cacheKey(), JSON.stringify({ app: appBody(), L: S.L, del: S.del, dirty: [...new Set([...Store.dirty, ...Store.pending])], at: now() }));
    else if (Store.mode === "local") localStorage.setItem(LS_KEY, JSON.stringify({ ...appBody(), L: S.L, del: S.del }));
  } catch (e) { /* armazenamento do aparelho indisponível */ }
}
const withTimeout = (p, ms = 15000) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: "unavailable", message: "timeout" }), ms))]);
async function pushLogMonth(k) {
  const ref = Store.col.doc(k);
  const snap = await withTimeout(ref.get());
  const remote = snap.exists ? snap.data() : { items: [], del: [] };
  const del = new Set([...(remote.del || []), ...(S.del[k] || [])]);
  const local = S.L[k] || []; const ids = new Set(local.map(i => i.id));
  const extra = (remote.items || []).filter(i => !ids.has(i.id) && !del.has(i.id));
  const merged = [...local.filter(i => !del.has(i.id)), ...clone(extra)];
  const delArr = [...del].slice(-3000);
  const changed = extra.length > 0 || merged.length !== local.length;
  S.L[k] = merged; S.del[k] = delArr;
  await withTimeout(ref.set({ items: clone(merged), del: delArr }));
  return changed;
}
function flush() {
  clearTimeout(Store.timer);
  saveCache();
  if (Store.mode !== "db") { updateSync(); return; }
  if (Store.flushing) { Store.again = true; return; }
  if (!Store.dirty.size) { updateSync(); return; }
  if (navigator.onLine === false) { Store.hadTrouble = true; updateSync(); return; }
  Store.flushing = true; updateSync();
  (async () => {
    let failed = false, merged = false;
    while (Store.dirty.size) {
      const k = Store.dirty.values().next().value; Store.dirty.delete(k); Store.pending.add(k);
      try {
        if (k === "app") await withTimeout(Store.col.doc("app").set(clone(appBody())));
        else if (await pushLogMonth(k)) merged = true;
      } catch (e) {
        const c = e && e.code;
        if (c === "quota_exceeded") toast("O espaço de dados está cheio. Exporte um backup e apague registros antigos.");
        else if (c === "invalid_argument" || c === "revoked" || c === "not_granted" || c === "capability_disabled") toast("Não foi possível salvar (" + c + "). Suas mudanças ficam neste aparelho.");
        else { Store.dirty.add(k); failed = true; Store.hadTrouble = true; }
      } finally { Store.pending.delete(k); }
      if (failed) break;
    }
    Store.flushing = false; saveCache();
    if (failed) { Store.retry = Math.min((Store.retry || 2500) * 2, 60000); clearTimeout(Store.rt); Store.rt = setTimeout(flush, Store.retry); }
    else { Store.retry = 0; if (Store.hadTrouble) { Store.hadTrouble = false; toast("Alterações feitas offline foram sincronizadas."); } }
    if (merged) renderAll(); else updateSync();
    if (Store.again) { Store.again = false; if (Store.dirty.size) flush(); }
  })();
}
function syncChip() {
  if (Store.mode === "local") return `<button class="chip mid" style="border:0" data-act="tab" data-k="more">Só neste aparelho</button>`;
  if (Store.mode !== "db") return "";
  const n = Store.dirty.size + Store.pending.size;
  if (navigator.onLine === false || (Store.hadTrouble && n)) return `<span class="chip no">Offline${n ? " · " + n + (n > 1 ? " pendentes" : " pendente") : ""}</span>`;
  if (n) return `<span class="chip">Salvando…</span>`;
  return `<span class="chip ok">Sincronizado</span>`;
}
function updateSync() { const el = document.getElementById("sync"); if (el) el.innerHTML = syncChip(); }
addEventListener("online", () => { Store.retry = 0; flush(); updateSync(); });
addEventListener("offline", updateSync);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") flush(); else saveCache(); });
addEventListener("pagehide", saveCache);
function loadApp(d) {
  S.types = d.types || []; S.lists = d.lists || []; S.running = (d.running || []).map(r => ({ regs: [], ...r }));
  S.settings = { ...defaultSettings(), ...(d.settings || {}) }; S.example = !!d.example;

function applySnap(snap) {
  for (const d of snap.docs) {
    if (!d.exists || Store.dirty.has(d.id) || Store.pending.has(d.id)) continue;
    const body = clone(d.data());
    if (d.id === "app") loadApp(body);
    else if (d.id.startsWith("log-")) { S.L[d.id] = body.items || []; S.del[d.id] = body.del || []; }
  }
  saveCache();
}

/* ---------- sincronização pelo GitHub: um gist secreto na conta do usuário, cada documento criptografado (AES-GCM 256) ---------- */
const GH = "https://api.github.com";
const GIST_DESC = "Ponteiro · sincronização (criptografado)";
function ghCfg() { try { return JSON.parse(localStorage.getItem("ponteiro.gh") || "null"); } catch (e) { return null; } }
function toB64(u8) { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }

async function deriveKey(pass, saltB64) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);

const importRawKey = b64 => crypto.subtle.importKey("raw", fromB64(b64), "AES-GCM", true, ["encrypt", "decrypt"]);

async function gh(token, path, opt = {}) {
  let r;

    throw { code: "unavailable", auth: true, status: r.status, message: "token recusado" };
  }
  if (r.status === 404) throw { code: "not_found", status: 404, message: "não encontrado" };

function gistCollection(cfg, key) {
  const snapOf = docs => ({ metadata: { fromCache: false }, docs: Object.entries(docs).map(([id, d]) => ({ id, exists: true, data: () => d })) });
  return {
    doc: k => ({
      get: async () => { const { docs } = await ghReadDocs(cfg.token, cfg.gist, key); return docs[k] ? { exists: true, data: () => docs[k] } : { exists: false, data: () => undefined }; },
      set: async body => { await gh(cfg.token, "/gists/" + cfg.gist, { method: "PATCH", body: JSON.stringify({ files: { [k + ".enc"]: { content: await seal(key, body) } } }) }); },
    }),

    if (hit) return hit.id;
    if (list.length < 100) break;
  }

}
const connCode = cfg => "ponteiro1:" + btoa(JSON.stringify({ t: cfg.token, g: cfg.gist, k: cfg.key }));
function parseConn(v) { try { if (!v.trim().startsWith("ponteiro1:")) return null; const o = JSON.parse(atob(v.trim().slice(10))); return o.t && o.g && o.k ? o : null; } catch (e) { return null; } }

            } else {

              key = await deriveKey(pw, salt);
              const g = await gh(token, "/gists", { method: "POST", body: JSON.stringify({ description: GIST_DESC, public: false, files: {
                "ponteiro.meta.json": { content: JSON.stringify({ v: 1, salt, check: await seal(key, { ok: true }) }) },
                "LEIA-ME.md": { content: "Dados do app Ponteiro, criptografados com a senha escolhida no app. Não edite estes arquivos." } } }) });

        } catch (e) {

            : e && e.code === "not_found" ? "Não encontrei os dados desse código de conexão. Gere um novo no outro aparelho."
            : "Não consegui falar com o GitHub. Confira a internet e tente de novo.");

        }
        let docs = {};
        if (!created) { try { docs = (await ghReadDocs(token, gistId, key)).docs; } catch (e) { msg("Não consegui ler os dados no GitHub. Tente de novo."); return; } }
        const has = !!docs.app;

        $("#g_confirm", el).innerHTML = `<button class="btn primary" id="g_go">${has ? "Usar os dados sincronizados" : "Enviar e ativar"}</button>`;
        $("#g_go", el).onclick = () => {
          let cache;
          if (has) { cache = { app: docs.app, L: {}, del: {}, dirty: [] }; for (const k in docs) if (k.startsWith("log-")) { cache.L[k] = docs[k].items || []; cache.del[k] = docs[k].del || []; } }
          else cache = { app: appBody(), L: S.L, del: S.del, dirty: ["app", ...Object.keys(S.L)] };

        };
      };
    } });
}

async function boot() {
  renderAll();
  let db = null, id = null;
  try {
    if (window.claude && typeof window.claude.use === "function") {
      db = await window.claude.use("db");
      const user = await window.claude.use("user");
      id = user ? await user.id() : null;
    }
  } catch (e) { db = null; }
  const cfg = !(db && id) ? ghCfg() : null;
  let ghKey = null;
  if (cfg) { try { ghKey = await importRawKey(cfg.key); } catch (e) { ghKey = null; } }
  if ((db && id) || (cfg && ghKey)) {
    Store.mode = "db"; Store.uid = id || cfg.gist;
    Store.col = db && id ? db.collection("data/users/" + id) : gistCollection(cfg, ghKey);
    let cache = null;
    try { cache = JSON.parse(localStorage.getItem(cacheKey()) || "null"); } catch (e) { cache = null; }
    if (cache && cache.app) {
      loadApp(cache.app); S.L = cache.L || {}; S.del = cache.del || {};
      for (const k of cache.dirty || []) Store.dirty.add(k);
      if (Store.dirty.size) Store.hadTrouble = true;
      Store.ready = true; renderAll();
    }
    let checked = false;
    const subscribe = () => Store.col.onSnapshot(snap => {
      applySnap(snap);
      if (!checked && (!snap.metadata.fromCache || snap.docs.some(d => d.id === "app" && d.exists))) {
        checked = true;
        if (!snap.docs.some(d => d.id === "app" && d.exists)) { if (cache && cache.app) markApp(); else seedExample(); }
        Store.ready = true; flush();
      }
      if (Store.ready) renderAll();
    }, err => { if (err && err.code === "unavailable") setTimeout(subscribe, 5000); else toast("A conexão com seus dados caiu. Suas mudanças ficam neste aparelho; recarregue a página quando puder."); });
    subscribe();
  } else {
    Store.mode = "local";
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch (e) { raw = null; }
    if (raw) { loadApp(raw); S.L = raw.L || {}; S.del = raw.del || {}; } else seedExample();
    Store.ready = true; renderAll();
  }
}

/* ---------- dados de exemplo (marcados como exemplo) ---------- */
function seedExample() {
  const T = (name, color, icon, parent = null, isGroup = false, order = 0) => { const t = { id: uid(), name, color, icon, parent, isGroup, order, archived: false }; S.types.push(t); return t; };
  S.types = [];
  const work = T("Trabalho", "#2F5BEA", "💼", null, true, 0);
  const code = T("Código", "#2F5BEA", "💻", work.id, false, 0);
  const meet = T("Reuniões", "#6C4AB6", "👥", work.id, false, 1);
  const mail = T("Email", "#3E92CC", "📧", work.id, false, 2);
  const home = T("Casa", "#F3A712", "🏠", null, true, 1);
  const cook = T("Cozinhar", "#E4572E", "🍳", home.id, false, 0);
  const clean = T("Limpeza", "#8D6A4F", "🧹", home.id, false, 1);
  const sleep = T("Sono", "#6B7C85", "💤", null, false, 2);
  const read = T("Leitura", "#0B9A93", "📚", null, false, 3);
  const gym = T("Exercício", "#2E933C", "🏋️", null, false, 4);
  const bus = T("Deslocamento", "#9BBF5A", "🚌", null, false, 5);
  const fun = T("Lazer", "#C2378D", "🎮", null, false, 6);
  S.L = {}; S.running = [];
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const today = sod(now());
  for (let dd = 6; dd >= 0; dd--) {
    const day = addDays(today, -dd); const wd = new Date(day).getDay(); const weekend = wd === 0 || wd === 6;
    let t = day + 7 * HOUR + Math.round(rnd() * 3) * 10 * MIN;
    const plan = weekend
      ? [[read, 70], [cook, 50], [clean, 60], [fun, 120], [gym, 45], [cook, 60], [fun, 90], [read, 40]]
      : [[cook, 25], [bus, 35], [mail, 30], [code, 120], [meet, 45], [cook, 40], [code, 110], [meet, 30], [mail, 20], [bus, 40], [gym, 40], [cook, 45], [fun, 60], [read, 35]];
    for (const [ty, mins] of plan) {
      const len = Math.round(mins * (0.8 + rnd() * 0.4)) * MIN;
      const gap = Math.round(rnd() * 3) * 5 * MIN;

/* ---------- cronômetros: atividades e registros ---------- */
const runElapsed = r => r.acc + (r.state === "running" ? now() - r.since : 0);
const runById = id => S.running.find(x => x.id === id);
function startType(typeId) {
  const ex = S.running.find(r => r.typeId === typeId);
  if (ex) { if (ex.state === "paused") resumeRun(ex.id); else toast(typeById(typeId).name + " já está rodando."); return; }
  const mode = S.settings.startMode;
  for (const r of [...S.running]) { if (r.state !== "running") continue; if (mode === "stop") stopRun(r.id, true); else if (mode === "pause") pauseRun(r.id, true); }
  const t = now();
  S.running.unshift({ id: uid(), typeId, state: "running", since: t, acc: 0, started: t, comment: "", regs: [] });
  markApp(); renderAll();
}
function pauseRun(id, quiet) { const r = runById(id); if (!r || r.state !== "running") return; const t = now(); logInterval(r.typeId, r.since, t, r.comment); r.acc += t - r.since; r.state = "paused"; markApp(); if (!quiet) renderAll(); }

function stopRun(id, quiet) {

  for (const g of [...(r.regs || [])]) stopReg(r.id, g.id, true);
  S.running = S.running.filter(x => x.id !== id); markApp();
  if (!quiet) { toast((typeById(r.typeId) || GONE).name + ": " + fmtDur(total) + " registrados."); renderAll(); }
}
/* registro: cronômetro próprio dentro da atividade, que não pausa a atividade */
function startReg(runId) { const r = runById(runId); if (!r) return; const t = now(); (r.regs ??= []).push({ id: uid(), state: "running", since: t, acc: 0, started: t, comment: "" }); markApp(); renderAll(); }
function regOf(runId, regId) { const r = runById(runId); return r && (r.regs || []).find(g => g.id === regId); }
function pauseReg(runId, regId) { const g = regOf(runId, regId); if (!g || g.state !== "running") return; g.acc += now() - g.since; g.state = "paused"; markApp(); renderAll(); }

function stopReg(runId, regId, quiet) {
  const r = runById(runId); const g = regOf(runId, regId); if (!g) return;
  const ms = runElapsed(g); const end = now();
  if (ms >= 1000) addLog({ id: uid(), kind: "reg", typeId: r.typeId, start: g.started, end, ms, comment: g.comment || "" });
  r.regs = r.regs.filter(x => x.id !== regId); markApp();
  if (!quiet) { toast("Registro salvo: " + fmtDur(ms) + "."); renderAll(); }

/* soma de tempo por tipo em [a,b), incluindo o que está rodando (registros não contam: já estão dentro da atividade) */
function segmentsIn(a, b) {
  const segs = [];
  for (const l of timeLogs()) if (l.end > a && l.start < b) segs.push({ typeId: l.typeId, s: Math.max(l.start, a), e: Math.min(l.end, b), log: l });
  for (const r of S.running) if (r.state === "running" && now() > a && r.since < b) segs.push({ typeId: r.typeId, s: Math.max(r.since, a), e: Math.min(now(), b), live: r });
  return segs;
}
function sumByType(a, b) { const m = new Map(); for (const g of segmentsIn(a, b)) m.set(g.typeId, (m.get(g.typeId) || 0) + g.e - g.s); return m; }

function viewLog() {
  const a = addDays(sod(now()), UI.histDay), b = addDays(a, 1);
  const segs = segmentsIn(a, b);
  const regs = allLogs().filter(l => l.kind === "reg" && l.end > a && l.start < b);
  const span = Math.max(0, Math.min(b, now()) - a); const cov = coveredMs(segs);
  const ordered = [...segs].sort((x, y) => x.s - y.s); let lastEnd = -1;
  const blocks = ordered.map(g => { const ov = g.s < lastEnd; lastEnd = Math.max(lastEnd, g.e); return `<i class="${ov ? "ov" : ""}" style="--c:${colorOf(g.typeId)};left:${((g.s - a) / DAY * 100).toFixed(3)}%;width:${((g.e - g.s) / DAY * 100).toFixed(3)}%" title="${esc(typeById(g.typeId)?.name || "")} ${fmtHM(g.s)}–${fmtHM(g.e)}"></i>`; }).join("");
  // registros aparecem logo abaixo do intervalo da mesma atividade que os contém
  const used = new Set();
  const row = g => { const t = typeById(g.typeId) || GONE; const p = t.parent && typeById(t.parent); const full = g.log || g.live; const crossed = g.log && (g.log.start < a || g.log.end > b);
    let out = `<button class="item" style="--c:${t.color}" data-act="${g.log ? "editlog" : "rnote"}" data-id="${g.log ? g.log.id : g.live.id}"><span class="dot em">${esc(t.icon)}</span><span class="nm">${esc(t.name)}${p ? ` <span class="sub">· ${esc(p.name)}</span>` : ""}</span><span class="du">${fmtDur(g.e - g.s)}</span><span class="tm">${fmtHM(g.s)} – ${g.live ? "agora" : fmtHM(g.e)}${crossed ? " · parte do intervalo" : ""}${g.live ? " · rodando" : ""}</span>${full.comment ? `<span class="cm">${esc(full.comment)}</span>` : ""}</button>`;
    for (const rg of regs) if (!used.has(rg.id) && rg.typeId === g.typeId && rg.start >= g.s - MIN && rg.start <= g.e) { used.add(rg.id); out += regRow(rg); }
    if (g.live) for (const rg of g.live.regs || []) out += `<button class="item regrow" style="--c:${t.color}" data-act="regnote" data-run="${g.live.id}" data-id="${rg.id}"><span class="dot">⏱</span><span class="nm">${rg.comment ? esc(rg.comment) : "Registro em andamento"}</span><span class="du">${fmtDur(runElapsed(rg))}</span><span class="tm">desde ${fmtHM(rg.started)} · ${rg.state === "running" ? "rodando" : "pausado"}</span></button>`;
    return out; };
  const regRow = rg => { const t = typeById(rg.typeId) || GONE; return `<button class="item regrow" style="--c:${t.color}" data-act="editreg" data-id="${rg.id}"><span class="dot">⏱</span><span class="nm">${rg.comment ? esc(rg.comment) : "Registro"}</span><span class="du">${fmtDur(rg.ms ?? rg.end - rg.start)}</span><span class="tm">${fmtHM(rg.start)} – ${fmtHM(rg.end)} · registro em ${esc(t.name)}</span></button>`; };
  let rows = [...segs].sort((x, y) => y.s - x.s).map(row).join("");
  rows += regs.filter(r => !used.has(r.id)).map(regRow).join("");
  return `${exampleBanner()}
  <div class="dayline"><div class="strip" role="img" aria-label="Linha do tempo do dia">${blocks}</div><div class="ticks"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
  <div class="kv"><span>Registrado <b>${fmtDur(cov)}</b></span><span>Sem registro <b>${fmtDur(span - cov)}</b></span><span>Intervalos <b>${segs.length}</b></span>${regs.length ? `<span>Registros <b>${regs.length}</b></span>` : ""}</div></div>
  <section class="section"><div class="rowhead"><h2>Intervalos</h2><button class="btn" data-act="newlog">${ICON.plus} Adicionar</button></div>
  ${rows ? `<div class="list">${rows}</div>` : `<div class="empty">Nada registrado neste dia.</div>`}</section>`;
}

function donutSVG(parts, total, centerTop, centerBottom) {
  const R = 46, C = 2 * Math.PI * R; let off = 0;
  const arcs = total > 0 ? parts.filter(p => p.ms > 0).map(p => { const len = p.ms / total * C; const s = `<circle r="${R}" cx="60" cy="60" fill="none" stroke="${p.color}" stroke-width="18" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"></circle>`; off += len; return s; }).join("") : `<circle r="${R}" cx="60" cy="60" fill="none" stroke="var(--sunk)" stroke-width="18"></circle>`;
  return `<svg class="donut" viewBox="0 0 120 120" role="img" aria-label="Distribuição do tempo">${arcs}<text x="60" y="60" text-anchor="middle" font-size="${centerTop.length > 8 ? 9.5 : 13}" font-weight="500">${esc(centerTop)}</text><text class="lbl" x="60" y="74" text-anchor="middle">${esc(centerBottom)}</text></svg>`;
}
function barsSVG(days) {

  const bw = (W - pl) / days.length; let g = "";
  for (let v = 0; v <= top; v += stepH) { const y = pt + (H - pb - pt) * (1 - v / top); g += `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}"></line><text x="${pl - 4}" y="${y + 3}" text-anchor="end">${v / HOUR}h</text>`; }
  days.forEach((d, i) => { const h = (H - pb - pt) * d.ms / top; const x = pl + i * bw + bw * 0.18; g += `<rect x="${x.toFixed(1)}" y="${(H - pb - h).toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--accent)"><title>${esc(d.label)}: ${fmtDur(d.ms)}</title></rect>`; if (days.length <= 12 || i % Math.ceil(days.length / 8) === 0) g += `<text x="${(pl + i * bw + bw / 2).toFixed(1)}" y="${H - 4}" text-anchor="middle">${esc(d.tick)}</text>`; });
  return `<svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tempo registrado por dia">${g}</svg>`;
}
function viewStats() {
  const [a, b] = periodRange(UI.statKind, UI.statOff);
  const segs = segmentsIn(a, b); const raw = sumByType(a, b); const roll = rollup(raw);
  const tracked = [...raw.values()].reduce((x, y) => x + y, 0);
  const span = Math.max(0, Math.min(b, now()) - a); const untracked = Math.max(0, span - coveredMs(segs));
  const tops = topLevel().map(t => ({ id: t.id, name: t.name, color: t.color, ms: roll.get(t.id) || 0 })).filter(p => p.ms > 0).sort((x, y) => y.ms - x.ms);
  for (const [id, ms] of raw) if (!typeById(id) && ms > 0) tops.push({ id, name: "Tipo removido", color: "#6B7C85", ms });
  const showU = S.settings.showUntracked && untracked > 0;
  const parts = showU ? [...tops, { id: "_u", name: "Sem registro", color: "var(--untracked)", ms: untracked }] : tops;
  const denom = parts.reduce((x, y) => x + y.ms, 0);
  const row = (p, child) => { const pc = denom ? p.ms / denom * 100 : 0; const t = typeById(p.id); const isG = t && t.isGroup;
    return `<button class="srow ${child ? "child" : ""}" style="--c:${p.color}" ${isG ? `data-act="sopen" data-id="${p.id}" aria-expanded="${!!UI.statOpen[p.id]}"` : "disabled"}><span class="sw"></span><span class="nm">${t ? `<span class="em">${esc(t.icon)}</span> ` : ""}${esc(p.name)}${isG ? (UI.statOpen[p.id] ? " ▾" : " ▸") : ""}</span><span class="du">${fmtDur(p.ms)}</span><span class="pc">${pc.toFixed(1)}%</span><span class="bar"><span style="width:${pc.toFixed(2)}%"></span></span></button>`; };
  let rows = "";
  for (const p of parts) { rows += row(p, false); const t = typeById(p.id); if (t && t.isGroup && UI.statOpen[p.id]) for (const c of childrenOf(t.id)) { const ms = roll.get(c.id) || 0; if (ms > 0) rows += row({ id: c.id, name: c.name, color: c.color, ms }, true); } }
  let perDay = "";
  if (UI.statKind === "week" || UI.statKind === "month") { const days = []; for (let d = a; d < b; d = addDays(d, 1)) { const e = addDays(d, 1); const dt = new Date(d); days.push({ ms: coveredMs(segmentsIn(d, e)), label: fmtDayLong(d), tick: UI.statKind === "week" ? DIAS[dt.getDay()].slice(0, 3) : String(dt.getDate()) }); } perDay = `<div class="chartcard">${barsSVG(days)}</div>`; }
  if (UI.statKind === "year") { const ms = []; for (let m = 0; m < 12; m++) { const s = new Date(new Date(a).getFullYear(), m, 1).getTime(), e = new Date(new Date(a).getFullYear(), m + 1, 1).getTime(); ms.push({ ms: coveredMs(segmentsIn(s, e)), label: MESES[m], tick: MESES[m].slice(0, 1).toUpperCase() }); } perDay = `<div class="chartcard">${barsSVG(ms)}</div>`; }
  return `<div class="chartcard">${donutSVG(parts, denom, fmtDur(tracked), "registrado")}
    <div class="kv"><span>Registrado <b>${fmtDur(tracked)}</b></span>${S.settings.showUntracked ? `<span>Sem registro <b>${fmtDur(untracked)}</b></span>` : ""}<span>Tipos <b>${tops.length}</b></span></div></div>
  ${parts.length ? `<div class="list">${rows}</div>` : `<div class="empty">Nada registrado neste período.</div>`}
  ${perDay}`;
}

/* ---------- telas cheias (empilháveis) ---------- */
function openLayer(title, body, opts = {}) {
  const el = document.createElement("div");
  el.className = "fs"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); el.setAttribute("aria-label", title);
  const left = opts.left ?? `<button class="btn ghost" data-act="close">Cancelar</button>`;
  const right = opts.right ?? (opts.okLabel ? `<button class="btn primary" data-ok>${esc(opts.okLabel)}</button>` : `<span></span>`);
  el.innerHTML = `<div class="fsbar gutter"><div class="in">${left}<h3>${esc(title)}</h3>${right}</div></div><div class="fsbody gutter">${body}</div>`;
  $("#layers").appendChild(el); document.body.classList.add("locked");
  if (opts.onMount) opts.onMount(el);
  if (opts.focus) { const f = el.querySelector(opts.focus); if (f) setTimeout(() => { f.focus(); if (f.setSelectionRange && f.value) f.setSelectionRange(f.value.length, f.value.length); }, 60); }
  return el;
}
function closeLayer(el) { (el || $("#layers").lastElementChild)?.remove(); if (!$("#layers").children.length) document.body.classList.remove("locked"); }
function armButton(btn, label, fn) { if (btn.classList.contains("armed")) { fn(); return; } btn.dataset.orig = btn.textContent; btn.classList.add("armed"); btn.textContent = label; setTimeout(() => { if (btn.isConnected) { btn.classList.remove("armed"); btn.textContent = btn.dataset.orig; } }, 3500); }

/* comentário em tela cheia: atividade em andamento, registro em andamento ou registro salvo */
function noteEditor({ title, ctx, value, placeholder, onSave }) {
  openLayer(title, `${ctx}<label for="n_t" class="small" style="font-weight:700">Comentário</label><textarea id="n_t" class="note" placeholder="${esc(placeholder)}">${esc(value)}</textarea>`, {
    okLabel: "Salvar", focus: "#n_t",
    onMount: el => { el.querySelector("[data-ok]").onclick = () => { onSave(el.querySelector("#n_t").value.trim()); closeLayer(el); renderAll(); }; } });
}
const ctxBox = (t, line) => `<div class="ctx" style="--c:${t.color}"><span class="ico em">${esc(t.icon)}</span><span><span class="t">${esc(t.name)}</span><br><span class="s">${line}</span></span></div>`;
/* tela da atividade / do registro em andamento: cronômetro ao vivo, pausar/retomar, encerrar e comentário */
function liveEditor({ title, ctx, clockAttr, clockText, isRunning, value, onSave, onToggle, stopLabel, onStop }) {
  openLayer(title, `${ctx}
    <div class="regctl"><span class="rbig" ${clockAttr}>${clockText}</span>
      <button class="btn" id="lv_pp"></button>
      <button class="btn danger" id="lv_stop">${ICON.stop} ${esc(stopLabel)}</button></div>
    <label for="n_t" class="small" style="font-weight:700">Comentário</label><textarea id="n_t" class="note">${esc(value)}</textarea>`, {
    okLabel: "Salvar",
    onMount: el => {
      const note = () => el.querySelector("#n_t").value.trim();
      const pp = el.querySelector("#lv_pp");
      const label = () => { const on = isRunning(); pp.innerHTML = on ? ICON.pause + " Pausar" : ICON.play + " Retomar"; el.querySelector(".rbig").classList.toggle("paused", !on); };
      label();
      el.querySelector("[data-ok]").onclick = () => { onSave(note()); closeLayer(el); renderAll(); };
      pp.onclick = () => { onSave(note()); onToggle(); label(); };
      el.querySelector("#lv_stop").onclick = () => { onSave(note()); closeLayer(el); onStop(); };
    } });
}
function editRunNote(id) {

  liveEditor({ title: t.name, ctx: ctxBox(t, "Desde " + fmtHM(r.started)), clockAttr: `data-run="${r.id}"`, clockText: fmtClock(runElapsed(r)),

  openLayer("Registro", `${ctxBox(t, fmtHM(rg.start) + " – " + fmtHM(rg.end) + " · " + fmtDur(rg.ms ?? rg.end - rg.start))}

function typeOptions(sel) {
  const opts = []; const walk = (pid, depth) => { for (const t of childrenOf(pid)) { if (!t.isGroup) opts.push(`<option value="${t.id}" ${t.id === sel ? "selected" : ""}>${"  ".repeat(depth)}${esc(t.icon)} ${esc(t.name)}</option>`); if (t.isGroup) walk(t.id, depth + 1); } };
  walk(null, 0);
  if (sel && !opts.some(o => o.includes(`value="${sel}"`)) && typeById(sel)) opts.unshift(`<option value="${sel}" selected>${esc(typeById(sel).name)}</option>`);
  return opts.join("");
}
function editLog(id) {
  const l = id ? allLogs().find(x => x.id === id) : null;
  const def = l || (() => { const base = addDays(sod(now()), UI.histDay); const e = UI.histDay === 0 ? now() : base + 12 * HOUR; return { typeId: topLevel().flatMap(t => t.isGroup ? childrenOf(t.id) : [t])[0]?.id, start: e - HOUR, end: e, comment: "" }; })();
  openLayer(l ? "Editar intervalo" : "Novo intervalo", `
    <label>Tipo de atividade<select id="f_type">${typeOptions(def.typeId)}</select></label>
    <div class="tf"><label for="f_s">Início</label><div class="tfrow"><input id="f_s" type="datetime-local" step="1" value="${toLocalInput(def.start)}"><button type="button" class="btn" data-now="f_s">Agora</button></div></div>
    <div class="tf"><label for="f_e">Fim</label><div class="tfrow"><input id="f_e" type="datetime-local" step="1" value="${toLocalInput(def.end)}"><button type="button" class="btn primary" data-now="f_e">Agora</button></div></div>
    <label>Comentário<textarea id="f_c" class="note" style="min-height:180px">${esc(def.comment)}</textarea></label>
    <p class="small" id="f_msg"></p>
    ${l ? `<div class="sheetbar"><button class="btn danger" id="f_del">Apagar intervalo</button></div>` : ""}`, {
    okLabel: "Salvar",
    onMount: el => {
      el.querySelectorAll("[data-now]").forEach(b => b.onclick = () => { const i = $("#" + b.dataset.now, el); i.value = toLocalInput(now()); i.dispatchEvent(new Event("change")); $("#f_msg", el).textContent = ""; });
      el.querySelector("[data-ok]").onclick = () => { const typeId = $("#f_type", el).value, s = fromLocalInput($("#f_s", el).value), e = fromLocalInput($("#f_e", el).value);
        if (!typeId) { $("#f_msg", el).textContent = "Escolha um tipo de atividade."; return; }
        if (!(e > s)) { $("#f_msg", el).textContent = "O fim precisa ser depois do início."; return; }
        if (l) removeLog(l.id); addLog({ id: l ? l.id : uid(), typeId, start: s, end: e, comment: $("#f_c", el).value.trim() });
        closeLayer(el); toast(l ? "Intervalo atualizado." : "Intervalo adicionado."); renderAll(); };
      if (l) $("#f_del", el).onclick = ev => armButton(ev.currentTarget, "Toque de novo para apagar", () => { removeLog(l.id); closeLayer(el); toast("Intervalo apagado."); renderAll(); });
    } });
}

function editType(id, asGroup) {
  const t = id ? typeById(id) : { name: "", color: COLORS[(S.types.length * 5) % COLORS.length], icon: asGroup ? "🗂️" : "⏱️", parent: UI.openGroup && !asGroup ? UI.openGroup : null, isGroup: !!asGroup, archived: false };
  const draft = { color: t.color, icon: t.icon };
  const groups = S.types.filter(g => g.isGroup && g.id !== id && !descendants(id || "").includes(g.id) && !g.archived);
  const nLogs = id ? allLogs().filter(l => descendants(id).includes(l.typeId)).length : 0;
  const what = t.isGroup ? "pasta" : "tipo";
  openLayer(id ? "Editar " + what : (t.isGroup ? "Nova pasta" : "Novo tipo"), `
    <div class="iconpick" style="--c:${draft.color}"><span class="cur em" id="t_cur">${esc(draft.icon)}</span><button class="btn" id="t_icon">Escolher ícone</button></div>
    <label>Nome<input id="t_n" type="text" maxlength="40" value="${esc(t.name)}" placeholder="Nome"></label>
    <label>Dentro da pasta<select id="t_p"><option value="">Nenhuma (nível principal)</option>${groups.map(g => `<option value="${g.id}" ${g.id === t.parent ? "selected" : ""}>${esc(g.icon)} ${esc(g.name)}</option>`).join("")}</select></label>
    <label>Cor<div class="swatches" id="t_col">${COLORS.map(c => `<button type="button" style="--c:${c}" data-c="${c}" aria-label="Cor ${c}" aria-pressed="${c === draft.color}"></button>`).join("")}</div></label>
    ${id ? `<label class="check"><input id="t_ar" type="checkbox" ${t.archived ? "checked" : ""}> Arquivado</label>` : ""}
    <p class="small" id="t_msg">${id && nLogs ? `Apagar ${t.isGroup ? "a pasta apaga os tipos dentro dela e" : "este tipo apaga"} ${nLogs} item${nLogs > 1 ? "s" : ""} do histórico. Arquivar mantém o histórico.` : ""}</p>
    ${id ? `<div class="sheetbar"><button class="btn danger" id="t_del">Apagar ${what}</button></div>` : ""}`, {
    okLabel: "Salvar", focus: id ? null : "#t_n",
    onMount: el => {
      $("#t_col", el).onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; draft.color = b.dataset.c; el.querySelectorAll("#t_col button").forEach(x => x.setAttribute("aria-pressed", x === b)); $(".iconpick", el).style.setProperty("--c", draft.color); };
      $("#t_icon", el).onclick = () => emojiPicker(draft.icon, e => { draft.icon = e; $("#t_cur", el).textContent = e; });
      $("#t_cur", el).onclick = () => $("#t_icon", el).click();
      el.querySelector("[data-ok]").onclick = () => { const name = $("#t_n", el).value.trim(); if (!name) { $("#t_msg", el).textContent = "Dê um nome."; $("#t_n", el).focus(); return; }
        const parent = $("#t_p", el).value || null;
        if (id) Object.assign(t, { name, parent, color: draft.color, icon: draft.icon, archived: !!$("#t_ar", el)?.checked });
        else S.types.push({ id: uid(), name, parent, color: draft.color, icon: draft.icon, isGroup: !!asGroup, order: S.types.length, archived: false });
        markApp(); closeLayer(el); toast("Salvo."); renderAll(); };
      if (id) $("#t_del", el).onclick = ev => armButton(ev.currentTarget, "Toque de novo para apagar", () => {
        const ids = descendants(id);
        dropLogs(l => ids.includes(l.typeId));
        S.types = S.types.filter(x => !ids.includes(x.id)); S.running = S.running.filter(r => !ids.includes(r.typeId));
        if (ids.includes(UI.openGroup)) UI.openGroup = null;
        markApp(); closeLayer(el); toast("Apagado."); renderAll(); });
    } });
}

/* ---------- seletor de emojis: todos os emojis do iOS/macOS + campo livre para o teclado de emojis ---------- */
let EMOJI_PARSED = null;
function emojiList() { if (!EMOJI_PARSED) EMOJI_PARSED = EMOJI_DATA.map(([cat, s]) => [cat, s.split("\n").map(r => { const i = r.indexOf("\t"); return [r.slice(0, i), r.slice(i + 1)]; })]); return EMOJI_PARSED; }
function recentEmojis() { try { return JSON.parse(localStorage.getItem("ponteiro.recentes") || "[]"); } catch (e) { return []; } }
function pushRecent(e) { try { const r = [e, ...recentEmojis().filter(x => x !== e)].slice(0, 24); localStorage.setItem("ponteiro.recentes", JSON.stringify(r)); } catch (err) { /* sem armazenamento */ } }
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function firstEmoji(str) {
  const s = (str || "").trim(); if (!s) return "";
  const seg = typeof Intl !== "undefined" && Intl.Segmenter ? [...new Intl.Segmenter("pt", { granularity: "grapheme" }).segment(s)][0].segment : [...s][0];
  return /\p{Extended_Pictographic}|\p{Regional_Indicator}|[#-9]️?⃣/u.test(seg) ? seg : "";
}
function emojiPicker(current, onPick) {
  const data = emojiList(); const rec = recentEmojis();
  const cats = (rec.length ? [["Recentes", rec.map(e => [e, ""])]] : []).concat(data);
  const grid = (list, sel) => list.map(([e, n]) => `<button type="button" data-e="${e}" title="${esc(n)}" aria-label="${esc(n || e)}" aria-pressed="${e === sel}">${e}</button>`).join("");
  const el = openLayer("Escolher ícone", `
    <div class="epick-top">
      <div class="typeemoji"><input id="e_free" type="text" inputmode="text" maxlength="16" placeholder="Colar emoji" aria-label="Digite ou cole qualquer emoji"><button class="btn" id="e_use" disabled>Usar</button></div>
      <input id="e_q" type="search" placeholder="Buscar" aria-label="Buscar emoji">
      <div class="ecats" id="e_cats">${cats.map(([c], i) => `<button type="button" data-cat="${i}" aria-pressed="${i === 0}">${esc(c)}</button>`).join("")}</div>
    </div>
    <div id="e_body">${cats.map(([c, list], i) => `<div class="ehead" id="ecat${i}">${esc(c)}</div><div class="egrid">${grid(list, current)}</div>`).join("")}</div>
`, {
    left: `<button class="btn ghost" data-act="close">Cancelar</button>` });
  const pick = e => { pushRecent(e); onPick(e); closeLayer(el); };
  $("#e_body", el).onclick = e => { const b = e.target.closest("[data-e]"); if (b) pick(b.dataset.e); };
  const free = $("#e_free", el), use = $("#e_use", el);
  free.oninput = () => { use.disabled = !firstEmoji(free.value); };
  use.onclick = () => { const e = firstEmoji(free.value); if (e) pick(e); };
  free.onkeydown = ev => { if (ev.key === "Enter") { ev.preventDefault(); use.click(); } };
  $("#e_cats", el).onclick = e => { const b = e.target.closest("[data-cat]"); if (!b) return; $("#e_q", el).value = ""; renderBody(""); el.querySelectorAll("#e_cats button").forEach(x => x.setAttribute("aria-pressed", x === b)); el.querySelector("#ecat" + b.dataset.cat)?.scrollIntoView({ block: "start" }); };
  let qt = null;
  const renderBody = q => {
    if (!q) { $("#e_body", el).innerHTML = cats.map(([c, list], i) => `<div class="ehead" id="ecat${i}">${esc(c)}</div><div class="egrid">${grid(list, current)}</div>`).join(""); return; }
    const words = norm(q).split(/\s+/).filter(Boolean);
    const hits = []; for (const [, list] of data) for (const [e, n] of list) { const nn = norm(n); if (words.every(w => nn.includes(w))) hits.push([e, n]); }
    $("#e_body", el).innerHTML = hits.length ? `<div class="ehead">${hits.length} resultado${hits.length > 1 ? "s" : ""}</div><div class="egrid">${grid(hits.slice(0, 400), current)}</div>` : `<p class="empty">Nenhum emoji com “${esc(q)}”. Tente outra palavra ou use o campo de cima com o teclado de emojis.</p>`;
  };
  $("#e_q", el).oninput = ev => { clearTimeout(qt); qt = setTimeout(() => renderBody(ev.target.value.trim()), 120); };
}

/* ---------- grupos de ações (checklists) ---------- */
function newList() {
  const draft = { icon: "✅" };
  openLayer("Novo grupo", `
    <div class="iconpick" style="--c:var(--accent)"><span class="cur em" id="l_cur">${draft.icon}</span><button class="btn" id="l_icon">Escolher ícone</button></div>
    <label>Nome do grupo<input id="l_n" type="text" maxlength="50" placeholder="Nome"></label><p class="small" id="l_msg"></p>`, {
    okLabel: "Criar", focus: "#l_n",
    onMount: el => {
      $("#l_icon", el).onclick = () => emojiPicker(draft.icon, e => { draft.icon = e; $("#l_cur", el).textContent = e; });
      const go = () => { const name = $("#l_n", el).value.trim(); if (!name) { $("#l_msg", el).textContent = "Dê um nome ao grupo."; return; }
        const l = { id: uid(), name, icon: draft.icon, items: [] }; S.lists.push(l); markApp(); closeLayer(el); renderAll(); openList(l.id, true); };
      el.querySelector("[data-ok]").onclick = go; $("#l_n", el).onkeydown = ev => { if (ev.key === "Enter") { ev.preventDefault(); go(); } };
    } });
}
function openList(id, focusAdd) {
  const l = S.lists.find(x => x.id === id); if (!l) return;
  const el = openLayer(l.name, `<div id="lv"></div>`, { left: `<button class="btn ghost" data-act="close">Fechar</button>` });
  const draw = (keepFocus) => {
    const pct = listPct(l); const done = l.items.filter(i => i.done).length;
    $(".fsbar h3", el).textContent = l.name;
    $("#lv", el).innerHTML = `
      <div style="display:flex;gap:12px;align-items:center"><button class="iconpick" id="lv_icon" style="--c:var(--accent);background:none;border:0;padding:0" aria-label="Trocar ícone"><span class="cur em">${esc(l.icon || "✅")}</span></button>
        <input class="titlein" id="lv_name" value="${esc(l.name)}" maxlength="50" aria-label="Nome do grupo"></div>
      <div class="bigpct"><b>${pct}%</b><span class="sub">${done} de ${l.items.length} ${l.items.length === 1 ? "ação feita" : "ações feitas"}</span></div>
      <div class="meter ${pct === 100 && l.items.length ? "done" : ""}"><span style="width:${pct}%"></span></div>
      ${l.items.length ? `<div class="checks" id="lv_items">${l.items.map(i => `<div class="ck ${i.done ? "on" : ""}" data-rid="${i.id}" role="checkbox" aria-checked="${i.done}" tabindex="0"><span class="box">${ICON.check}</span><span class="tx">${esc(i.text)}</span><button class="iconbtn sm" data-del="${i.id}" aria-label="Excluir ${esc(i.text)}">${ICON.x}</button><button class="grip" aria-label="Arrastar para reordenar">${ICON.grip}</button></div>`).join("")}</div>` : `<div class="empty">Nenhuma ação.</div>`}
      <form class="addrow" id="lv_add"><input id="lv_new" type="text" maxlength="80" placeholder="Nova ação" enterkeyhint="done"><button class="btn primary" type="submit">Adicionar</button></form>
      <div class="sheetbar"><button class="btn" id="lv_reset" ${done ? "" : "disabled"}>Desmarcar todas</button><button class="btn danger" id="lv_delete">Excluir grupo</button></div>`;
    $("#lv_add", el).onsubmit = ev => { ev.preventDefault(); const v = $("#lv_new", el).value.trim(); if (!v) return; l.items.push({ id: uid(), text: v, done: false }); markApp(); draw(true); };
    if (keepFocus) { const i = $("#lv_new", el); i.focus(); }
    $("#lv_name", el).onchange = ev => { const v = ev.target.value.trim(); if (v) { l.name = v; markApp(); $(".fsbar h3", el).textContent = v; renderAll(); } else ev.target.value = l.name; };
    $("#lv_icon", el).onclick = () => emojiPicker(l.icon, e => { l.icon = e; markApp(); draw(); renderAll(); });
    $("#lv_reset", el).onclick = () => { l.items.forEach(i => i.done = false); markApp(); draw(); renderAll(); };
    $("#lv_delete", el).onclick = ev => armButton(ev.currentTarget, "Toque de novo para excluir o grupo", () => { S.lists = S.lists.filter(x => x.id !== l.id); markApp(); closeLayer(el); toast("Grupo excluído."); renderAll(); });
    const list = $("#lv_items", el);
    if (list) {
      list.onclick = ev => {
        if (list.dataset.suppress) { delete list.dataset.suppress; return; }
        const del = ev.target.closest("[data-del]"); if (del) { l.items = l.items.filter(i => i.id !== del.dataset.del); markApp(); draw(); renderAll(); return; }
        if (ev.target.closest(".grip")) return;
        const row = ev.target.closest("[data-rid]"); if (!row) return; const it = l.items.find(i => i.id === row.dataset.rid); it.done = !it.done; markApp(); draw(); renderAll();
      };
      list.onkeydown = ev => { if ((ev.key === " " || ev.key === "Enter") && ev.target.matches("[data-rid]")) { ev.preventDefault(); ev.target.click(); } };
      enableReorder(list, ids => { const map = new Map(l.items.map(i => [i.id, i])); l.items = ids.map(x => map.get(x)).filter(Boolean); markApp(); draw(); renderAll(); });
    }
  };
  draw(focusAdd);
}
/* segurar e arrastar: pressione ~0,35s em qualquer parte da ação (ou arraste direto pela alça) */
function enableReorder(list, onDone) {
  let drag = null, timer = null, start = null;
  const rows = () => [...list.querySelectorAll("[data-rid]")];
  const begin = (row, pid) => { drag = { row, pid }; row.classList.remove("pressing"); row.classList.add("dragging"); try { row.setPointerCapture(pid); } catch (e) { /* ok */ } if (navigator.vibrate) navigator.vibrate(12); };
  const cancelPress = () => { clearTimeout(timer); timer = null; if (start) start.row.classList.remove("pressing"); start = null; };
  list.addEventListener("pointerdown", e => {
    if (e.button > 0) return;
    const row = e.target.closest("[data-rid]"); if (!row || e.target.closest("[data-del]")) return;
    start = { x: e.clientX, y: e.clientY, row };
    if (e.target.closest(".grip")) { e.preventDefault(); begin(row, e.pointerId); return; }
    row.classList.add("pressing");
    timer = setTimeout(() => { if (start) begin(row, e.pointerId); }, 350);
  });
  list.addEventListener("pointermove", e => {
    if (!drag) { if (start && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 8) cancelPress(); return; }
    e.preventDefault();
    const y = e.clientY; const others = rows().filter(r => r !== drag.row);
    let before = null; for (const r of others) { const b = r.getBoundingClientRect(); if (y < b.top + b.height / 2) { before = r; break; } }
    if (before) { if (drag.row.nextElementSibling !== before) list.insertBefore(drag.row, before); } else if (list.lastElementChild !== drag.row) list.appendChild(drag.row);
    const fs = list.closest(".fs"); if (fs) { if (y < 90) fs.scrollTop -= 8; else if (y > innerHeight - 70) fs.scrollTop += 8; }
  });
  const end = () => { cancelPress(); if (!drag) return; drag.row.classList.remove("dragging"); drag = null; list.dataset.suppress = "1"; setTimeout(() => { delete list.dataset.suppress; }, 50); onDone(rows().map(r => r.dataset.rid)); };
  list.addEventListener("pointerup", end); list.addEventListener("pointercancel", end);
  list.addEventListener("touchmove", e => { if (drag) e.preventDefault(); }, { passive: false });
  list.addEventListener("contextmenu", e => e.preventDefault());
}

/* ---------- exportar / importar ---------- */
function csvText() {
  const q = v => /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  const f = ms => { const d = new Date(ms); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + fmtHM(ms); };
  const lines = ["Tipo de atividade,Pasta,Linha,Início,Fim,Duração (h:mm),Duração (h),Comentário"];
  for (const l of allLogs().sort((a, b) => a.start - b.start)) { const t = typeById(l.typeId); const g = t && t.parent && typeById(t.parent); const m = Math.round((l.kind === "reg" ? (l.ms ?? l.end - l.start) : l.end - l.start) / MIN);
    lines.push([q(t ? t.name : "Tipo removido"), q(g ? g.name : ""), l.kind === "reg" ? "Registro" : "Intervalo", f(l.start), f(l.end), Math.floor(m / 60) + ":" + pad(m % 60), (m / 60).toFixed(2), q(l.comment || "")].join(",")); }
  return lines.join("\n");
}
async function offerFile(filename, text) {
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
  if (dl) { try { await dl.save({ filename, data: new Blob([text], { type: filename.endsWith(".csv") ? "text/csv" : "application/json" }) }); toast("Arquivo salvo."); return; } catch (e) { if (e && e.code === "declined") return; if (e && e.code === "rate_limited") { toast("Já há um salvamento aberto. Tente de novo em instantes."); return; } } }
  if (!window.claude) {
    try { const url = URL.createObjectURL(new Blob([text], { type: filename.endsWith(".csv") ? "text/csv" : "application/json" })); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); return; } catch (e) { /* cai na cópia manual */ }
  }
  openLayer(filename, `<p class="small">Não deu para salvar o arquivo direto daqui. Copie o conteúdo abaixo e cole num arquivo.</p><textarea class="out" id="o_t" readonly>${esc(text)}</textarea>`, {
    left: `<button class="btn ghost" data-act="close">Fechar</button>`, okLabel: "Copiar",
    onMount: el => { el.querySelector("[data-ok]").onclick = () => { const ta = $("#o_t", el); navigator.clipboard.writeText(text).then(() => toast("Copiado."), () => { ta.focus(); ta.select(); toast("Texto selecionado. Use copiar do sistema."); }); }; } });
}
function plistToJs(n) {
  switch (n.tagName) {
    case "dict": { const o = {}; const k = [...n.children]; for (let i = 0; i + 1 < k.length; i += 2) o[k[i].textContent] = plistToJs(k[i + 1]); return o; }
    case "array": return [...n.children].map(plistToJs);
    case "integer": return parseInt(n.textContent, 10);
    case "real": return parseFloat(n.textContent);
    case "true": return true; case "false": return false;
    case "date": return Date.parse(n.textContent);
    default: return n.textContent;
  }
}
const rgbHex = (r, g, b) => "#" + [r, g, b].map(v => Math.max(0, Math.min(255, v | 0)).toString(16).padStart(2, "0")).join("");
function parseImport(text) {
  const t = text.trim();
  if (t.startsWith("{")) { const d = JSON.parse(t); if (!d.types || !d.L) throw new Error("Esse JSON não é um backup do Ponteiro.");
    const L = {}; for (const it of Object.values(d.L).flat()) { if (!(it.end > it.start)) continue; const n = { ...it, id: uid() }; (L[monthKey(n.start)] ??= []).push(n); }
    return { kind: "Ponteiro", data: { ...d, L, running: [], example: false } }; }
  if (t.startsWith("<")) {
    const doc = new DOMParser().parseFromString(t, "application/xml"); const root = doc.querySelector("plist > *");
    if (!root || doc.querySelector("parsererror")) throw new Error("O arquivo não é um plist XML válido.");
    const p = plistToJs(root); const cats = p.Categories || p.categories; const logs = p.Logs || p.logs;
    if (!Array.isArray(cats) || !Array.isArray(logs)) throw new Error("Não encontrei as listas Categories e Logs neste plist.");
    const types = cats.map(c => ({ id: "c" + c.catId, name: String(c.name || "Sem nome"), color: rgbHex(c.red, c.green, c.blue), icon: c.is_group ? "🗂️" : "⏱️", parent: c.category_group_id ? "c" + c.category_group_id : null, isGroup: !!c.is_group, order: c.cat_order || 0, archived: false }));
    const L = {}; for (const l of logs) { if (!(l.endDate > l.startDate)) continue; const it = { id: uid(), typeId: "c" + l.catId, start: l.startDate * 1000, end: l.endDate * 1000, comment: l.comment || "" }; (L[monthKey(it.start)] ??= []).push(it); }
    const s = p.Settings || {}; const settings = { ...defaultSettings(), firstWeekday: s.first_weekday === 1 ? 0 : 1, minSec: s.min_log_time || 0 };
    return { kind: "aTimeLogger", data: { types, lists: S.lists, settings, running: [], L, example: false } };
  }
  throw new Error("Formato não reconhecido. Backups novos do aTimeLogger podem vir em outro formato; este importador lê o plist XML (.atlbkp).");
}
function importFile(file) {
  const fr = new FileReader();
  fr.onload = () => {
    let res; try { res = parseImport(String(fr.result)); } catch (e) { toast(e.message || "Não foi possível ler o arquivo."); return; }
    const nLogs = Object.values(res.data.L).flat().length;
    openLayer("Importar backup", `<p>Backup do ${esc(res.kind)}: ${res.data.types.length} tipos e ${nLogs} itens de histórico em <b>${esc(file.name)}</b>.</p><p class="small">Importar substitui seus tipos e seu histórico atuais. Exporte um backup antes se quiser guardar o que tem.</p>
      <div class="sheetbar"><button class="btn danger" id="i_go">Substituir meus dados</button></div>`, {
      onMount: el => { $("#i_go", el).onclick = ev => armButton(ev.currentTarget, "Toque de novo para confirmar", () => {
        dropLogs(() => true);
        loadApp(res.data); for (const k in res.data.L) { for (const it of res.data.L[k]) addLog(it); } markApp();
        closeLayer(el); UI.tab = "log"; UI.histDay = 0; toast("Importado: " + nLogs + " itens."); renderAll(); }); } });
  };
  fr.onerror = () => toast("Não foi possível ler o arquivo.");
  fr.readAsText(file);
}

/* ---------- eventos ---------- */
function toast(msg) { const r = $("#toastRoot"); r.innerHTML = `<div class="toast">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => { r.innerHTML = ""; }, 2800); }
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const { act, id, k, d, v, run } = el.dataset;
  switch (act) {
    case "tab": UI.tab = k; window.scrollTo(0, 0); renderAll(); break;
    case "start": startType(id); break;
    case "opengroup": UI.openGroup = UI.openGroup === id ? null : id; renderAll(); break;
    case "pause": pauseRun(id); break;
    case "resume": resumeRun(id); break;
    case "stop": stopRun(id); break;
    case "rnote": editRunNote(id); break;
    case "regstart": startReg(id); break;
    case "regpause": pauseReg(run, id); break;
    case "regresume": resumeReg(run, id); break;
    case "regstop": stopReg(run, id); break;
    case "regnote": editRegNote(run, id); break;
    case "editreg": editSavedReg(id); break;
    case "hist": UI.histDay = Math.min(0, UI.histDay + +d); renderAll(); break;
    case "skind": UI.statKind = k; UI.statOff = 0; renderAll(); break;
    case "soff": UI.statOff = Math.min(0, UI.statOff + +d); renderAll(); break;
    case "sopen": UI.statOpen[id] = !UI.statOpen[id]; renderAll(); break;
    case "editlog": editLog(id); break;
    case "newlog": editLog(null); break;
    case "newlist": newList(); break;
    case "openlist": openList(id); break;
    case "newtype": editType(null, false); break;
    case "newgroup": editType(null, true); break;
    case "edittype": editType(id); break;
    case "toggleArch": UI.showArchived = !UI.showArchived; renderAll(); break;
    case "set": { const cur = S.settings[k]; S.settings[k] = typeof cur === "number" ? +v : typeof cur === "boolean" ? v === "true" : v; markApp(); renderAll(); break; }
    case "exportcsv": offerFile("ponteiro-relatorio.csv", csvText()); break;
    case "exportjson": offerFile("ponteiro-backup.json", JSON.stringify({ ...appBody(), L: S.L, exportedAt: new Date().toISOString() }, null, 1)); break;
    case "clearex": clearExample(); break;
    case "syncon": syncSetup(); break;
    case "syncoff": syncOff(el); break;
    case "synccode": copyConn(); break;
    case "close": closeLayer(el.closest(".fs")); break;
  }
});
document.addEventListener("change", e => { if (e.target.id === "importFile" && e.target.files[0]) { importFile(e.target.files[0]); e.target.value = ""; } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#layers").children.length) closeLayer(); });

/* relógios ao vivo: só os números a cada segundo; a tela inteira a cada minuto */
setInterval(() => {
  for (const el of document.querySelectorAll("[data-run]")) { if (!el.classList.contains("clock") && !el.classList.contains("rbig")) continue; const r = runById(el.dataset.run); if (r) el.textContent = fmtClock(runElapsed(r)); }
  for (const el of document.querySelectorAll("[data-reg]")) { const [a, b] = el.dataset.reg.split(":"); const g = regOf(a, b); if (g) el.textContent = fmtShortClock(runElapsed(g)); }
}, 1000);
setInterval(() => { if (Store.ready) renderAll(); }, 60000);
boot();
/* atualização automática: ao abrir, ao voltar para a tela e a cada 5 min, confere se há versão nova publicada e recarrega */
const BUILD = "20261023061922";
let swReg = null;
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(r => { swReg = r; }).catch(() => {}));
async function checkUpdate() {
  if (navigator.onLine === false) return;
  try { if (swReg) swReg.update(); } catch (e) { /* ok */ }
  let latest = null;
  try { const h = await (await fetch("./?u=" + Date.now(), { cache: "no-store" })).text(); const m = h.match(/const BUILD = "([0-9]+)"/); latest = m && m[1]; } catch (e) { return; }
  if (!latest || latest === BUILD) return;
  if ($("#layers").children.length) { setTimeout(checkUpdate, 15000); return; }   // não interrompe uma edição aberta
  try { if (sessionStorage.getItem("ponteiro.updatedTo") === latest) return; sessionStorage.setItem("ponteiro.updatedTo", latest); } catch (e) { /* ok */ }
  saveCache(); toast("Atualizando o Ponteiro…"); setTimeout(() => location.reload(), 400);
}
setTimeout(checkUpdate, 2500);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
addEventListener("pageshow", e => { if (e.persisted) checkUpdate(); });
setInterval(checkUpdate, 5 * 60 * 1000);
