<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F6F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Semana">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Semana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F6F4F1; --surface:#FFFFFF; --sunk:#EEEAE4; --ink:#1C1A17; --muted:#7A736B; --faint:#A9A29A; --line:#E7E2DB;
  --accent:#B94A33; --accent-ink:#FFFFFF; --accent-soft:#F7E4DD; --bad:#B3261E;
  --L:46%; --font:"Figtree",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(28,26,23,.05),0 6px 20px rgba(28,26,23,.07);
}
@media (prefers-color-scheme: dark){:root{
  color-scheme:dark;
  --bg:#141312; --surface:#1E1C1A; --sunk:#191816; --ink:#EFEBE6; --muted:#A39C94; --faint:#6E6862; --line:#2D2A27;
  --accent:#EE8A70; --accent-ink:#1A0F0B; --accent-soft:#3A2520; --bad:#F2867D; --L:66%;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;touch-action:manipulation}
.tm,.mt,.dc,.sub,.big2,.sum .r1 span:last-child,.tw .fld,#e_th,#e_dh{font-variant-numeric:tabular-nums}
body.locked{overflow:hidden}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
input,textarea{font-size:16px}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{max-width:620px;margin:0 auto;min-height:100%;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:max(10px,env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.bar{display:flex;align-items:center;gap:4px;height:44px}
.wk{font-weight:700;font-size:17px;letter-spacing:-.01em;background:none;border:0;padding:6px 8px;border-radius:10px;white-space:nowrap}
.sp{flex:1}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:transparent;display:inline-grid;place-items:center;color:var(--ink);padding:0}
.ib:active{background:var(--sunk)}
.ib.muted{color:var(--muted)}

.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:6px 0 12px}
.dc{border:0;background:transparent;border-radius:14px;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink)}
.dc .l{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dc .n{font-size:19px;font-weight:700;line-height:1.2}
.dc .h{font-size:11px;color:var(--muted);height:14px;font-weight:500}
.dc.today .n{color:var(--accent)}
.dc[aria-current="date"]{background:var(--ink);color:var(--bg)}
.dc[aria-current="date"] .l,.dc[aria-current="date"] .h{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.dc[aria-current="date"].today .n{color:var(--bg)}

.dayhead{padding:6px 2px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.dayhead h1{margin:0;font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.025em}
.dayhead .sub{color:var(--muted);font-size:14px;margin-top:4px;font-weight:500}

#list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;position:relative}
.it{--c:hsl(var(--h,20) 50% var(--L));position:relative;display:flex;align-items:stretch;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;min-height:58px}
.it::before{content:"";width:4px;flex:none;background:var(--c)}
.ck{flex:none;width:44px;border:0;background:transparent;display:grid;place-items:center;padding:0}
.ck span{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s}
.ck svg{width:12px;height:12px;stroke:var(--surface);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.it.done .ck span{background:var(--c);border-color:var(--c)}
.it.done .ck svg{opacity:1}
.tm{flex:none;width:62px;display:flex;flex-direction:column;justify-content:center;font-size:14px;line-height:1.25;padding:8px 0}
.tm b{font-weight:600}
.tm span{color:var(--muted);font-size:13px}
.tm.pin b{color:var(--accent);font-weight:800}
.tm sup{font-size:9px;color:var(--muted);margin-left:1px;font-weight:600}
.bd{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:9px 6px 9px 4px;display:flex;flex-direction:column;justify-content:center;gap:1px}
.nm{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.mt{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.mt .was{text-decoration:line-through;color:var(--faint)}
.mt .fit{color:var(--accent);font-weight:600}
.mt .note{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.grip{flex:none;width:38px;display:grid;place-items:center;color:var(--faint);touch-action:none;cursor:grab}
.grip svg{width:16px;height:16px;fill:currentColor}
.it.now{box-shadow:0 0 0 2px var(--c),var(--shadow)}
.it.now::after{content:"";position:absolute;left:4px;bottom:0;height:3px;width:calc((100% - 4px) * var(--p,0));background:var(--c);opacity:.55}
.it.dragging{z-index:5;box-shadow:0 12px 32px rgba(0,0,0,.18);transition:none;cursor:grabbing}
.it.dragging .grip{cursor:grabbing}
.gap{font-size:12px;color:var(--bad);padding:0 6px;font-weight:600}

.add{display:grid;grid-template-columns:1fr 88px 64px 44px;gap:6px;margin-top:10px;background:var(--surface);border-radius:var(--r);padding:6px;box-shadow:var(--shadow)}
.add input,.add .tpick{border:0;background:var(--sunk);border-radius:10px;padding:10px 11px;min-width:0;outline:none}
.add input:focus{background:color-mix(in srgb,var(--accent-soft) 70%,var(--sunk))}
.add input::placeholder{color:var(--faint)}
.add input.err{box-shadow:inset 0 0 0 1.5px var(--bad)}
.add button[aria-label="Adicionar"]{border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;padding:0}
.add button[aria-label="Adicionar"] svg{width:20px;height:20px;stroke-width:2.6}
@media (max-width:380px){.add{grid-template-columns:1fr 80px 58px 40px}.add input{padding:10px 8px}}

/* folhas */
.veil{position:fixed;inset:0;z-index:40;background:rgba(10,9,8,.32);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-width:620px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:8px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
@media (min-width:700px){.veil{align-items:center}.sheet{border-radius:20px;max-width:480px}}
.sheet .knob{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h3{margin:4px 0 14px;font-size:20px;font-weight:800;letter-spacing:-.02em}
.sheet .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sheet .lab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.sheet .hint{font-size:14px;color:var(--muted)}
.fld{border:0;background:var(--sunk);border-radius:12px;padding:11px 12px;width:100%;outline:none}
.fld.big{font-size:22px;font-weight:700;letter-spacing:-.015em;padding:12px}
.fld.err{box-shadow:inset 0 0 0 1.5px var(--bad)}
textarea.fld{resize:vertical;min-height:64px}
.chip{border:0;background:var(--sunk);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip.sm{padding:7px 11px;min-width:40px}
.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;font-size:15px;background:var(--sunk);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.wide{flex:1}
.foot{display:flex;gap:8px;margin-top:20px}
.menu{display:flex;flex-direction:column;gap:2px;margin:0 -6px}
.menu>button,.menu>label{display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:13px 8px;border-radius:12px;font-weight:600;font-size:16px}
.menu>button:active,.menu>label:active{background:var(--sunk)}
.menu .r{margin-left:auto;color:var(--muted);font-weight:500;font-size:14px}
.menu .danger{color:var(--bad)}
.menu .danger.armed{background:var(--bad);color:#fff}
.tw{display:flex;align-items:center;gap:8px}
.tbig{border:0;background:var(--sunk);border-radius:12px;width:120px;padding:10px 0;font-size:22px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.tbig.empty{color:var(--faint);font-weight:500}
.add .tpick{background:var(--sunk);color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.add .tpick.empty{color:var(--faint);font-weight:400}
/* seletor de horário em rodas (estilo iPhone) */
.pkv{position:fixed;inset:0;z-index:50;background:rgba(10,9,8,.32);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.pk{width:100%;max-width:420px;background:var(--surface);border-radius:20px 20px 0 0;padding:4px 8px calc(14px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,.8,.2,1);user-select:none;-webkit-user-select:none}
@media (min-width:700px){.pkv{align-items:center}.pk{border-radius:20px}}
.pkbar{display:flex;align-items:center;justify-content:space-between;height:50px;padding:0 6px}
.pkbar b{font-size:16px;font-weight:700}
.pkbar button{border:0;background:none;color:var(--accent);font-size:17px;font-weight:500;padding:8px 8px}
.pkbar button.ok{font-weight:700}
.pkw{position:relative;display:flex;justify-content:center;align-items:center;height:220px;perspective:600px}
.pkband{position:absolute;left:14px;right:14px;top:90px;height:40px;background:var(--sunk);border-radius:10px}
.wcol{position:relative;width:84px;height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;outline:none;
  -webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent)}
.wcol::-webkit-scrollbar{display:none}
.wcol .padr{height:88px}
.wi{height:44px;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:500;scroll-snap-align:center;font-variant-numeric:tabular-nums;transform-origin:center;backface-visibility:hidden;cursor:pointer}
.pkc{position:relative;font-size:23px;font-weight:600;width:14px;text-align:center;top:-1px}
.pkclr{display:block;margin:6px auto 0;border:0;background:none;color:var(--bad);font-size:15px;font-weight:600;padding:8px 14px}
.sum{display:flex;flex-direction:column;gap:12px}
.sum .r1{display:flex;justify-content:space-between;font-weight:600;gap:12px}
.sum .r1 span:last-child{color:var(--muted);font-weight:500}
.sum .bar2{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:5px}
.sum .bar2 i{display:block;height:100%;border-radius:3px;background:hsl(var(--h) 50% var(--L))}
.big2{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}

.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 8px 10px 18px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:tup .2s ease;white-space:nowrap}
.toast:not(:has(button)){padding-right:18px}
.toast button{border:0;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px}
@keyframes up{from{transform:translateY(16px);opacity:0}}
@keyframes tup{from{transform:translate(-50%,12px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.shake{animation:shake .25s 2}
/* abas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:none;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
/* hábitos */
.hl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hc{--c:hsl(var(--h,20) 50% var(--L));display:flex;align-items:center;gap:12px;width:100%;border:0;text-align:left;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px 12px 0;overflow:hidden;position:relative;min-height:62px}
.hc::before{content:"";align-self:stretch;width:4px;background:var(--c);margin:-12px 0}
.hc .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hc .nm{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hc .dl{font-size:13px;color:var(--muted)}
.wdots{display:flex;gap:5px;flex:none}
.wdots i{width:10px;height:10px;border-radius:50%;display:block;box-sizing:border-box}
.wdots i.off{background:var(--line);transform:scale(.45)}
.wdots i.todo{border:1.6px solid var(--faint)}
.wdots i.miss{border:1.6px solid var(--line)}
.wdots i.done{background:var(--c)}
.wdots i.today{box-shadow:0 0 0 2px var(--bg),0 0 0 3.4px var(--c)}
.hadd{margin-top:10px;background:var(--surface);border-radius:var(--r);padding:6px;box-shadow:var(--shadow)}
.hadd .r{display:grid;grid-template-columns:1fr 44px;gap:6px}
.hadd input{border:0;background:var(--sunk);border-radius:10px;padding:10px 11px;min-width:0;outline:none}
.hadd input::placeholder{color:var(--faint)}
.hadd .r button{border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;padding:0}
.hadd .r button svg{width:20px;height:20px;stroke-width:2.6}
.dsel{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px 2px 2px}
.dsel .chip{padding:8px 0;min-width:0;font-size:13px}
.stat{display:flex;gap:28px;margin:2px 0 4px}
/* diário */
.hov{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 14px}
.hchip{--c:hsl(var(--h,20) 50% var(--L));border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px 6px 8px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;color:var(--ink)}
.hchip .d{width:14px;height:14px;border-radius:50%;border:1.6px solid var(--c);box-sizing:border-box;display:grid;place-items:center}
.hchip.on{background:color-mix(in srgb,var(--c) 16%,transparent);border-color:transparent}
.hchip.on .d{background:var(--c)}
.hchip .d svg{width:9px;height:9px;stroke:var(--surface);stroke-width:3.6;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.hchip.on .d svg{opacity:1}
.jl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.je{display:flex;gap:12px;width:100%;border:0;text-align:left;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 14px}
.je .t{flex:none;width:44px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;padding-top:1px}
.je .c{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.je .x{white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.je .x:empty{display:none}
.je .hs{display:flex;gap:5px;flex-wrap:wrap}
.je .hs span{--c:hsl(var(--h,20) 50% var(--L));font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--ink)}
.newj{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;border:0;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);padding:15px;font-size:16px;font-weight:700;box-shadow:var(--shadow)}
.newj svg{width:20px;height:20px;stroke-width:2.6}
.jh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.tchip{border:0;background:var(--sunk);border-radius:10px;padding:8px 14px;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
textarea.jtext{min-height:150px;font-size:17px;line-height:1.5;resize:none}
.hrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;text-align:left;padding:10px 4px;border-radius:12px;font-size:16px;font-weight:600}
.hrow:active{background:var(--sunk)}
.hrow .ck2{--c:hsl(var(--h,20) 50% var(--L));width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:background .15s,border-color .15s}
.hrow .ck2 svg{width:13px;height:13px;stroke:var(--surface);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.hrow[aria-pressed="true"] .ck2{background:var(--c);border-color:var(--c)}
.hrow[aria-pressed="true"] .ck2 svg{opacity:1}
.hrow[aria-disabled="true"]{opacity:.55}
.hrow .w{margin-left:auto;font-size:13px;color:var(--muted);font-weight:500}
.linkb{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;padding:8px 4px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="bar">
      <button class="ib muted" data-act="prevw" aria-label="Semana anterior"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="wk" data-act="today" id="wk"></button>
      <button class="ib muted" data-act="nextw" aria-label="Próxima semana"><svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      <div class="sp"></div>
      <button class="ib" data-act="summary" aria-label="Resumo da semana"><svg class="i" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
      <button class="ib" data-act="menu" aria-label="Mais"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
    </div>
    <nav class="strip" id="strip"></nav>
  </header>
  <main id="day" class="view" data-tab="plan">
    <div class="dayhead"><div><h1 id="dt"></h1><div class="sub" id="ds"></div></div></div>

      <button type="button" class="tpick empty" id="add_t" aria-label="Horário">Hora</button>
      <button aria-label="Adicionar"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

  </main>
  <main id="v-hab" class="view" data-tab="hab" hidden>
    <div class="dayhead"><div><h1>Hábitos</h1><div class="sub" id="hs"></div></div></div>
    <ul class="hl" id="hlist"></ul>
    <form class="hadd" id="hadd" autocomplete="off">
      <div class="r"><input name="n" placeholder="Novo hábito" enterkeyhint="done" aria-label="Novo hábito"><button aria-label="Criar hábito"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <div class="dsel" id="hdays" hidden></div>
    </form>

    <div class="dayhead"><div><h1 id="jt"></h1><div class="sub" id="js"></div></div></div>
    <div class="hov" id="hov"></div>
    <ul class="jl" id="jlist"></ul>

<nav class="tabs" aria-label="Abas"><div class="in">
  <button data-act="tab" data-k="plan"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4"/></svg>Semana</button>
  <button data-act="tab" data-k="hab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></svg>Hábitos</button>
  <button data-act="tab" data-k="jr"><svg viewBox="0 0 24 24"><path d="M6 3.5h10.5a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6z"/><path d="M6 3.5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2M9.5 8.5h5.5M9.5 12h5.5"/></svg>Diário</button>
</div></nav>
<div id="layer"></div>
<div id="pkRoot"></div>
<div id="toastRoot"></div>
<script>
"use strict";
/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const ICON = {
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  grip: '<svg viewBox="0 0 16 16"><circle cx="5.5" cy="3.5" r="1.3"/><circle cx="10.5" cy="3.5" r="1.3"/><circle cx="5.5" cy="8" r="1.3"/><circle cx="10.5" cy="8" r="1.3"/><circle cx="5.5" cy="12.5" r="1.3"/><circle cx="10.5" cy="12.5" r="1.3"/></svg>',
};
const WD = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
const WDL = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
const MO = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const MOL = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];

/* ---------- datas ---------- */
const keyOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const fromKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const weekOf = k => { const d = fromKey(k); const off = (d.getDay() - S.settings.weekStart + 7) % 7; return Array.from({ length: 7 }, (_, i) => addDays(k, i - off)); };

/* ---------- tempo ---------- */
const toMin = hhmm => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
function fmtT(m) { const d = Math.floor(m / 1440), r = ((m % 1440) + 1440) % 1440; return pad(Math.floor(r / 60)) + ":" + pad(r % 60) + (d ? `<sup>${d > 0 ? "+" : ""}${d}</sup>` : ""); }
const fmtTp = m => fmtT(m).replace(/<sup>.*<\/sup>/, "");
function fmtD(m) { if (m == null) return ""; if (m < 60) return m + " min"; const h = Math.floor(m / 60), r = m % 60; return h + "h" + (r ? pad(r) : ""); }
function parseTime(s) {
  s = String(s || "").trim().toLowerCase().replace(/^(às|as|@)\s*/, "");
  if (!s) return null;
  let h, mi, m;
  if (/^\d{3,4}$/.test(s)) { h = +s.slice(0, -2); mi = +s.slice(-2); }
  else if ((m = s.match(/^(\d{1,2})(?:\s*[:h.]\s*(\d{2})?)?$/))) { h = +m[1]; mi = +(m[2] || 0); }
  else return undefined;
  if (h > 23 || mi > 59) return undefined;
  return pad(h) + ":" + pad(mi);
}
function parseDur(s) {
  s = String(s || "").trim().toLowerCase().replace(",", ".");
  if (!s) return null;
  let m;
  if ((m = s.match(/^(\d+(?:\.\d+)?)\s*h(?:oras?|rs?)?\s*(\d{1,2})?\s*(?:m|min)?$/))) return Math.round(+m[1] * 60 + +(m[2] || 0));
  if ((m = s.match(/^(\d+):(\d{2})$/))) return +m[1] * 60 + +m[2];
  if ((m = s.match(/^(\d+)\s*(?:m|min|mins|minutos?)?$/))) return +m[1];
  return undefined;
}
/* "Academia 1h30 às 7:00" → nome, duração e horário */
function parseLine(str) {
  const w = String(str || "").trim().split(/\s+/).filter(Boolean); let dur, at;
  for (let k = 0; k < 4 && w.length > 1; k++) {
    const tok = w[w.length - 1], before = (w[w.length - 2] || "").toLowerCase();
    const looksTime = /^@/.test(tok) || /^\d{1,2}:\d{2}$/.test(tok) || /^(às|as)$/.test(before) || (/^\d{1,2}h(\d{2})?$/i.test(tok) && +tok.match(/^\d+/)[0] > 12);
    if (at === undefined && looksTime) { const t = parseTime(tok.replace(/^@/, "")); if (t) { at = t; w.pop(); if (w.length > 1 && /^(às|as)$/i.test(w[w.length - 1])) w.pop(); continue; } }
    if (dur === undefined && /^\d+(?:[.,]\d+)?h\d{0,2}$|^\d+(?:m|min)$/i.test(tok)) { const d = parseDur(tok); if (d != null) { dur = d; w.pop(); continue; } }
    break;
  }
  return { name: w.join(" "), dur, at };
}

/* ---------- motor de horários ----------
   Itens com horário fixo são âncoras e mandam. Entre duas âncoras, as atividades
   preenchem exatamente o intervalo: as sem duração dividem a sobra; se não houver
   sobra (ou faltar espaço), as durações são ajustadas. Antes da primeira âncora o
   horário é calculado para trás; depois da última, para frente. Sem âncora, sem horário. */
function split(total, weights) {
  const W = weights.reduce((a, b) => a + b, 0);
  if (!W) weights = weights.map(() => 1);
  const WW = W || weights.length, raw = weights.map(w => total * w / WW), fl = raw.map(Math.floor);
  let rem = total - fl.reduce((a, b) => a + b, 0);
  raw.map((r, i) => [r - fl[i], i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (rem > 0) { fl[i]++; rem--; } });
  return fl;
}
function fitSeg(durs, avail) {
  const fixed = durs.reduce((a, d) => a + (d ?? 0), 0), flex = durs.map((d, i) => d == null ? i : -1).filter(i => i >= 0);
  const out = durs.map(d => d ?? 0);
  if (avail <= 0) return out.map(() => 0);
  if (flex.length && avail >= fixed) { const sh = split(avail - fixed, flex.map(() => 1)); flex.forEach((i, j) => { out[i] = sh[j]; }); return out; }
  if (fixed === avail) return out;
  if (S.settings.fit === "last") {
    let li = -1; durs.forEach((d, i) => { if (d != null) li = i; });
    const rest = fixed - out[li];
    if (li >= 0 && avail - rest >= 0) { out[li] = avail - rest; return out; }
  }
  return split(avail, out);
}
function compute(items) {
  const R = items.map(it => ({ s: null, e: null, d: it.dur ?? null, anchor: it.at != null, flex: it.dur == null, fit: false, squeeze: false }));
  const A = []; let prev = null;
  items.forEach((it, i) => { if (it.at == null) return; let t = toMin(it.at); if (prev != null) while (t < prev) t += 1440; A.push([i, t]); prev = t; });
  if (!A.length) return R;
  let [a0, t] = A[0];
  for (let i = a0 - 1; i >= 0; i--) { const d = items[i].dur; if (d == null) { R[i].e = t; break; } R[i].s = t - d; R[i].e = t; t -= d; }
  for (let k = 0; k < A.length - 1; k++) {
    const [ia, ta] = A[k], [ib, tb] = A[k + 1], idx = [];
    for (let i = ia; i < ib; i++) idx.push(i);
    const durs = fitSeg(idx.map(i => items[i].dur ?? null), tb - ta);
    let c = ta;
    idx.forEach((i, j) => { R[i].s = c; R[i].d = durs[j]; c += durs[j]; R[i].e = c; R[i].fit = items[i].dur != null && durs[j] !== items[i].dur; });
    if (tb === ta && idx.some(i => (items[i].dur ?? 0) > 0)) R[ib].squeeze = true;
  }
  const [il, tl] = A[A.length - 1]; t = tl;
  for (let i = il; i < items.length; i++) { R[i].s = t; const d = items[i].dur; if (d == null) break; R[i].e = t + d; t += d; }
  return R;
}

/* ---------- estado ---------- */
const KEY = "semana.v1";
let S;
const blank = () => ({ days: {}, hab: { list: [], mt: 0 }, jr: {}, settings: { weekStart: 1, fit: "prop", mt: 0 } });
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { S = null; }
  if (!S || typeof S.days !== "object") S = blank();
  S.settings = { ...blank().settings, ...(S.settings || {}) };
  if (!S.hab || !Array.isArray(S.hab.list)) S.hab = { list: [], mt: 0 };
  if (!S.jr || typeof S.jr !== "object") S.jr = {};
}
function saveNow() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ok */ } }
function save() { saveNow(); cloudSoon(); }
const items = k => (S.days[k] && S.days[k].items) || [];
function setDay(k, list) { S.days[k] = { items: list, mt: Date.now() }; save(); }
function commit(k) { S.days[k] = { items: items(k), mt: Date.now() }; save(); render(); }
const hue = name => { let h = 0; for (const ch of String(name).toLowerCase().trim()) h = (h * 31 + ch.codePointAt(0)) >>> 0; return h % 360; };

let UI = { day: todayKey(), tab: (() => { try { return localStorage.getItem("semana.tab") || "plan"; } catch (e) { return "plan"; } })() };
if (!["plan", "hab", "jr"].includes(UI.tab)) UI.tab = "plan";

/* ---------- desenho ---------- */
function dayTotal(k) { return compute(items(k)).reduce((a, r) => a + (r.d || 0), 0); }
function render() {
  const k = UI.day, wk = weekOf(k), tk = todayKey();
  const a = fromKey(wk[0]), b = fromKey(wk[6]);
  $("#wk").textContent = a.getMonth() === b.getMonth() ? `${a.getDate()} – ${b.getDate()} ${MO[b.getMonth()]}` : `${a.getDate()} ${MO[a.getMonth()]} – ${b.getDate()} ${MO[b.getMonth()]}`;
  document.querySelectorAll(".view").forEach(v => { v.hidden = v.dataset.tab !== UI.tab; });
  document.querySelectorAll("nav.tabs button").forEach(b => { if (b.dataset.k === UI.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  $("#strip").hidden = UI.tab === "hab";
  $('[data-act="summary"]').hidden = UI.tab !== "plan";
  $("#strip").innerHTML = wk.map(d => {
    const dt = fromKey(d);
    let lab = "";
    if (UI.tab === "jr") { const sc = habsOn(d), dm = doneMap(d), dn = sc.filter(h => dm[h.id]).length; lab = sc.length ? dn + "/" + sc.length : jrList(d).length ? "•" : ""; }
    else { const tot = dayTotal(d); lab = tot ? fmtD(tot).replace(" min", "m") : ""; }
    return `<button class="dc${d === tk ? " today" : ""}" data-act="day" data-k="${d}"${d === k ? ' aria-current="date"' : ""}><span class="l">${WDL[dt.getDay()]}</span><span class="n">${dt.getDate()}</span><span class="h">${lab}</span></button>`;
  }).join("");
  if (UI.tab === "hab") { renderHab(); if (sheetRefresh) sheetRefresh(); return; }
  if (UI.tab === "jr") { renderJr(); if (sheetRefresh) sheetRefresh(); return; }

  const dt = fromKey(k), list = items(k), R = compute(list), hasT = R.some(r => r.s != null || r.e != null);
  $("#dt").textContent = (k === tk ? "Hoje" : k === addDays(tk, 1) ? "Amanhã" : k === addDays(tk, -1) ? "Ontem" : WD[dt.getDay()]);
  const parts = [];
  if (k === tk || k === addDays(tk, 1) || k === addDays(tk, -1)) parts.push(WD[dt.getDay()].toLowerCase());
  parts.push(dt.getDate() + " de " + MOL[dt.getMonth()]);
  const sub = [parts.join(", ")];
  if (list.length) {
    const ss = R.map(r => r.s).filter(v => v != null), ee = R.map(r => r.e).filter(v => v != null);
    if (ss.length && ee.length) sub.push(fmtTp(Math.min(...ss)) + "–" + fmtTp(Math.max(...ee)));
    const tot = R.reduce((a, r) => a + (r.d || 0), 0); if (tot) sub.push(fmtD(tot));
    const dn = list.filter(i => i.done).length; if (dn) sub.push(dn + "/" + list.length);
  }
  $("#ds").textContent = sub.join(" · ");

  let nowM = null; if (k === tk) { const n = new Date(); nowM = n.getHours() * 60 + n.getMinutes(); }
  $("#list").innerHTML = list.map((it, i) => {
    const r = R[i];
    let now = "", p = 0;
    if (nowM != null && r.s != null && r.e != null && r.e > r.s) for (const nm of [nowM, nowM + 1440]) if (nm >= r.s && nm < r.e) { now = " now"; p = (nm - r.s) / (r.e - r.s); }
    const meta = [];
    if (r.fit) meta.push(`<span class="fit">${fmtD(r.d)}</span><span class="was">${fmtD(it.dur)}</span>`);
    else if (r.d != null) meta.push(`<span>${fmtD(r.d)}</span>`);
    if (r.squeeze) meta.push(`<span class="gap">sem espaço antes</span>`);
    if (it.note) meta.push(`<span class="note">${esc(it.note.split("\n")[0])}</span>`);
    return `<li class="it${it.done ? " done" : ""}${now}" data-id="${it.id}" style="--h:${hue(it.name)};${now ? "--p:" + p.toFixed(3) : ""}">
      <button class="ck" data-act="done" aria-label="Concluir"><span>${ICON.check}</span></button>
      ${hasT ? `<div class="tm${r.anchor ? " pin" : ""}"><b>${r.s != null ? fmtT(r.s) : "&nbsp;"}</b><span>${r.e != null ? fmtT(r.e) : "&nbsp;"}</span></div>` : ""}
      <button class="bd" data-act="edit"><span class="nm">${esc(it.name)}</span>${meta.length ? `<span class="mt">${meta.join("")}</span>` : ""}</button>
      <div class="grip" aria-hidden="true">${ICON.grip}</div></li>`;
  }).join("");
  if (sheetRefresh) sheetRefresh();
}

/* ---------- adicionar ---------- */
const form = $("#add");
form.addEventListener("submit", e => {
  e.preventDefault();
  const fN = form.n, fD = form.d;
  const p = parseLine(fN.value);
  let dur = fD.value.trim() ? parseDur(fD.value) : p.dur ?? null;
  let at = addAt ?? p.at ?? null;
  fD.classList.remove("err");
  if (dur === undefined) { bad(fD); return; }
  if (!p.name) { bad(fN); fN.focus(); return; }
  const list = items(UI.day).slice();
  list.push({ id: uid(), name: p.name, dur, at, done: false, note: "" });
  setDay(UI.day, list); render();
  fN.value = fD.value = ""; setAddAt(null); fN.focus();
  const last = $("#list").lastElementChild; if (last) last.scrollIntoView({ block: "nearest", behavior: "smooth" });
});
function bad(f) { f.classList.add("err", "shake"); setTimeout(() => f.classList.remove("shake"), 520); }
form.d.addEventListener("input", () => form.d.classList.remove("err"));
let addAt = null;
function setAddAt(t) { addAt = t; const b = $("#add_t"); b.textContent = t || "Hora"; b.classList.toggle("empty", !t); }
$("#add_t").addEventListener("click", () => {
  const R = compute(items(UI.day)), ends = R.map(r => r.e).filter(v => v != null);
  const n = new Date(), fallback = ends.length ? fmtTp(Math.max(...ends)) : pad(n.getHours()) + ":" + pad(Math.round(n.getMinutes() / 5) * 5 % 60);
  pickTime(addAt, fallback, t => setAddAt(t));
});

/* ---------- seletor de horário em rodas ---------- */
const ROW = 44, REP = 7;
function wheel(n, value, label) {
  const col = document.createElement("div"); col.className = "wcol"; col.tabIndex = 0; col.setAttribute("aria-label", label);
  col.innerHTML = `<div class="padr"></div>${Array.from({ length: n * REP }, (_, i) => `<div class="wi" data-i="${i}">${pad(i % n)}</div>`).join("")}<div class="padr"></div>`;
  const els = col.querySelectorAll(".wi");
  const idx = () => Math.round(col.scrollTop / ROW);
  const paint = () => {
    const c = col.scrollTop / ROW, a = Math.max(0, Math.floor(c) - 4), b = Math.min(els.length - 1, Math.ceil(c) + 4);
    for (let i = a; i <= b; i++) { const d = i - c, ad = Math.min(Math.abs(d), 3); els[i].style.transform = `rotateX(${(-d * 20).toFixed(1)}deg)`; els[i].style.opacity = (1 - ad * 0.28).toFixed(2); }
  };
  let raf = 0, idle = 0;
  const recenter = () => { const i = idx(), v = ((i % n) + n) % n; if (i < n * 2 || i >= n * (REP - 2)) { col.scrollTop = (n * 3 + v) * ROW; paint(); } };
  col.addEventListener("scroll", () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; paint(); }); clearTimeout(idle); idle = setTimeout(recenter, 160); }, { passive: true });
  col.addEventListener("click", e => { const it = e.target.closest(".wi"); if (it) col.scrollTo({ top: +it.dataset.i * ROW, behavior: "smooth" }); });
  col.addEventListener("keydown", e => { if (e.key === "ArrowUp" || e.key === "ArrowDown") { e.preventDefault(); col.scrollTo({ top: (idx() + (e.key === "ArrowUp" ? -1 : 1)) * ROW, behavior: "smooth" }); } });
  col._init = () => { col.scrollTop = (n * 3 + value) * ROW; paint(); };
  col._val = () => ((idx() % n) + n) % n;
  return col;
}
function pickTime(current, fallback, onPick, opts = {}) {
  const start = current || fallback || "12:00", [h0, m0] = start.split(":").map(Number);
  const v = document.createElement("div"); v.className = "pkv";
  v.innerHTML = `<div class="pk" role="dialog" aria-modal="true" aria-label="Horário">
    <div class="pkbar"><button data-p="cancel">Cancelar</button><b>Horário</b><button class="ok" data-p="ok">OK</button></div>
    <div class="pkw"><div class="pkband"></div></div>
    ${current && !opts.noClear ? `<button class="pkclr" data-p="clear">Sem horário fixo</button>` : ""}</div>`;
  const hw = wheel(24, h0, "Horas"), mw = wheel(60, m0, "Minutos"), colon = document.createElement("div");
  colon.className = "pkc"; colon.textContent = ":";
  $(".pkw", v).append(hw, colon, mw);
  const close = () => { v.remove(); if (!$("#layer").firstElementChild) document.body.classList.remove("locked"); };
  v._ok = () => { const t = pad(hw._val()) + ":" + pad(mw._val()); close(); onPick(t); };
  v.addEventListener("click", e => {
    if (e.target === v) { close(); return; }
    const b = e.target.closest("[data-p]"); if (!b) return;
    if (b.dataset.p === "ok") v._ok();
    else if (b.dataset.p === "clear") { close(); onPick(null); }
    else close();
  });
  $("#pkRoot").appendChild(v); document.body.classList.add("locked");
  hw._init(); mw._init();
}
const overlay = () => $("#layer").firstElementChild || $("#pkRoot").firstElementChild;

/* ---------- folhas ---------- */
let sheetRefresh = null;
function openSheet(html, onClose) {
  closeSheet(true);
  const v = document.createElement("div"); v.className = "veil";
  v.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="knob"></div>${html}</div>`;
  v.addEventListener("click", e => { if (e.target === v) closeSheet(); });
  v._onClose = onClose;
  $("#layer").appendChild(v); document.body.classList.add("locked");
  return v.firstElementChild;
}
function closeSheet(silent) {
  const v = $("#layer").firstElementChild; if (!v) return;
  sheetRefresh = null; v.remove(); document.body.classList.remove("locked");
  if (!silent && v._onClose) v._onClose();
}
function arm(btn, label, fn) { if (btn.classList.contains("armed")) { fn(); return; } const o = btn.innerHTML; btn.classList.add("armed"); btn.textContent = label; setTimeout(() => { if (btn.isConnected) { btn.classList.remove("armed"); btn.innerHTML = o; } }, 3200); }

const PRESETS = [null, 15, 30, 45, 60, 90, 120];
function openEdit(id) {
  const k = UI.day, it = items(k).find(x => x.id === id); if (!it) return;
  const el = openSheet(`
    <input class="fld big" id="e_n" value="${esc(it.name)}" enterkeyhint="done" aria-label="Nome">

/* ---------- hábitos ---------- */
const WEEK = () => Array.from({ length: 7 }, (_, i) => (S.settings.weekStart + i) % 7);
const habById = id => S.hab.list.find(h => h.id === id);
const habRuns = (h, k) => h.days.includes(fromKey(k).getDay()) && (!h.created || k >= h.created);
const habsOn = k => S.hab.list.filter(h => habRuns(h, k));
function habCommit() { S.hab.mt = Date.now(); save(); render(); }
function daysLabel(days) {
  const set = new Set(days);
  if (set.size === 7) return "Todo dia";
  if (set.size === 0) return "Nenhum dia";
  if (set.size === 5 && [1, 2, 3, 4, 5].every(d => set.has(d))) return "Dias úteis";
  if (set.size === 2 && set.has(0) && set.has(6)) return "Fim de semana";
  return WEEK().filter(d => set.has(d)).map(d => WDL[d]).join(" · ");
}
function streak(h) {
  const tk = todayKey(); let n = 0, d = tk;
  for (let i = 0; i < 400; i++) {
    if (h.created && d < h.created) break;
    if (h.days.includes(fromKey(d).getDay())) { if (doneMap(d)[h.id]) n++; else if (d !== tk) break; }
    d = addDays(d, -1);
  }
  return n;
}
function weekDots(h, wk) {
  const tk = todayKey();
  return `<span class="wdots" aria-hidden="true">${wk.map(d => {
    const on = habRuns(h, d), done = !!doneMap(d)[h.id];
    const cls = done ? "done" : !on ? "off" : d < tk ? "miss" : "todo";
    return `<i class="${cls}${d === tk ? " today" : ""}"></i>`;
  }).join("")}</span>`;
}
function renderHab() {
  const wk = weekOf(UI.day), L = S.hab.list;
  let sc = 0, dn = 0;
  wk.forEach(d => { const dm = doneMap(d); habsOn(d).forEach(h => { sc++; if (dm[h.id]) dn++; }); });
  $("#hs").textContent = L.length ? (L.length === 1 ? "1 hábito" : L.length + " hábitos") + (sc ? ` · ${dn}/${sc} nesta semana` : "") : "";
  $("#hlist").innerHTML = L.map(h => `<li><button class="hc" data-act="openh" data-id="${h.id}" style="--h:${hue(h.name)}"><span class="tx"><span class="nm">${esc(h.name)}</span><span class="dl">${daysLabel(h.days)}</span></span>${weekDots(h, wk)}</button></li>`).join("");

}

/* ---------- diário ---------- */
const jrList = k => (S.jr[k] && S.jr[k].entries) || [];
const jrSorted = k => jrList(k).slice().sort((a, b) => a.at < b.at ? -1 : a.at > b.at ? 1 : 0);
function jrSet(k, list) { if (list.length) S.jr[k] = { entries: list, mt: Date.now() }; else if (S.jr[k]) S.jr[k] = { entries: [], mt: Date.now() }; save(); }
function doneMap(k) {
  const m = {};
  jrSorted(k).forEach(e => (e.habits || []).forEach(h => { if (!m[h]) m[h] = { entry: e.id, at: e.at }; }));
  return m;
}
const nowHM = () => { const n = new Date(); return pad(n.getHours()) + ":" + pad(n.getMinutes()); };
function dayTitle(k) {
  const tk = todayKey(), dt = fromKey(k);
  const title = k === tk ? "Hoje" : k === addDays(tk, 1) ? "Amanhã" : k === addDays(tk, -1) ? "Ontem" : WD[dt.getDay()];
  const sub = (title === WD[dt.getDay()] ? "" : WD[dt.getDay()].toLowerCase() + ", ") + dt.getDate() + " de " + MOL[dt.getMonth()];
  return [title, sub];
}
function renderJr() {
  const k = UI.day, [t, sub] = dayTitle(k), sc = habsOn(k), dm = doneMap(k), ents = jrSorted(k);
  $("#jt").textContent = t;
  const parts = [sub];
  if (ents.length) parts.push(ents.length === 1 ? "1 registro" : ents.length + " registros");
  if (sc.length) parts.push(sc.filter(h => dm[h.id]).length + "/" + sc.length + " hábitos");
  $("#js").textContent = parts.join(" · ");
  $("#hov").innerHTML = sc.map(h => `<button class="hchip${dm[h.id] ? " on" : ""}" data-act="hjump" data-h="${h.id}" style="--h:${hue(h.name)}"><span class="d">${ICON.check}</span>${esc(h.name)}</button>`).join("");
  $("#hov").hidden = !sc.length;
  $("#jlist").innerHTML = ents.map(e => {
    const hs = (e.habits || []).map(habById).filter(Boolean);
    return `<li><button class="je" data-act="openj" data-id="${e.id}"><span class="t">${esc(e.at)}</span><span class="c"><span class="x">${esc(e.text || "")}</span>${hs.length ? `<span class="hs">${hs.map(h => `<span style="--h:${hue(h.name)}">${esc(h.name)}</span>`).join("")}</span>` : ""}</span></button></li>`;
  }).join("");
}
function openEntry(k, id, preHabit) {
  if (!id) {
    const e = { id: uid(), at: nowHM(), text: "", habits: preHabit ? [preHabit] : [] };
    jrSet(k, [...jrList(k), e]); id = e.id; render();
  }
  const isFresh = !jrList(k).find(x => x.id === id).text;
  const cur = () => jrList(k).find(x => x.id === id);
  const upd = fn => { const e = cur(); if (!e) return; fn(e); jrSet(k, jrList(k)); render(); };
  const cleanup = () => { const e = cur(); if (e && !e.text.trim() && !(e.habits || []).length) { jrSet(k, jrList(k).filter(x => x.id !== id)); render(); } };
  const el = openSheet(`
    <div class="jh"><button class="tchip" id="j_t" aria-label="Hora do registro"></button><span class="hint" id="j_d"></span></div>
    <textarea class="fld jtext" id="j_text" rows="6" aria-label="Texto do registro"></textarea>
    <div id="j_hab"></div>
    <div class="foot"><button class="btn danger" id="j_del">Apagar</button><button class="btn primary wide" id="j_ok">Pronto</button></div>`, cleanup);
  const ta = $("#j_text", el); ta.value = cur().text || "";
  const dt = fromKey(k); $("#j_d", el).textContent = WD[dt.getDay()] + ", " + dt.getDate() + " de " + MOL[dt.getMonth()];
  let showOthers = false;
  sheetRefresh = () => {
    const e = cur(); if (!e) { closeSheet(true); return; }
    $("#j_t", el).textContent = e.at;
    const wd = dt.getDay(), all = S.hab.list, sc = all.filter(h => h.days.includes(wd)), ot = all.filter(h => !h.days.includes(wd));
    const dm = {}; jrSorted(k).forEach(x => { if (x.id !== id) (x.habits || []).forEach(h => { if (!dm[h]) dm[h] = x.at; }); });
    const row = h => { const mine = (e.habits || []).includes(h.id), other = !mine && dm[h.id];
      return `<button class="hrow" data-h="${h.id}" aria-pressed="${mine || !!other}"${other ? ' aria-disabled="true"' : ""} style="--h:${hue(h.name)}"><span class="ck2">${ICON.check}</span>${esc(h.name)}${other ? `<span class="w">às ${esc(other)}</span>` : ""}</button>`; };
    const others = ot.filter(h => (e.habits || []).includes(h.id) || dm[h.id]);
    const rest = ot.filter(h => !others.includes(h));
    $("#j_hab", el).innerHTML = !all.length ? "" : `
      ${sc.length || others.length ? `<div class="lab">Hábitos</div>${[...sc, ...others].map(row).join("")}` : ""}
      ${rest.length ? (showOthers ? `<div class="lab">Outros dias</div>${rest.map(row).join("")}` : `<button class="linkb" data-more="1">Outros hábitos</button>`) : ""}`;
  };
  sheetRefresh();
  ta.addEventListener("input", () => upd(e => { e.text = ta.value; }));
  $("#j_t", el).onclick = () => pickTime(cur().at, cur().at, t => upd(e => { e.at = t; }), { noClear: true });
  $("#j_hab", el).addEventListener("click", ev => {
    if (ev.target.closest("[data-more]")) { showOthers = true; sheetRefresh(); return; }
    const b = ev.target.closest(".hrow"); if (!b || b.getAttribute("aria-disabled") === "true") return;
    const h = b.dataset.h;
    upd(e => { e.habits = (e.habits || []).includes(h) ? e.habits.filter(x => x !== h) : [...(e.habits || []), h]; });
  });
  $("#j_del", el).onclick = ev => arm(ev.currentTarget, "Toque de novo para apagar", () => {
    const e = cur(); jrSet(k, jrList(k).filter(x => x.id !== id)); closeSheet(true); render();
    if (e.text.trim() || (e.habits || []).length) toast("Registro apagado", "Desfazer", () => { jrSet(k, [...jrList(k), e]); render(); });
  });
  $("#j_ok", el).onclick = () => closeSheet();
  if (isFresh && !preHabit) setTimeout(() => ta.focus(), 60);
}

/* ---------- cópia no GitHub (repositório privado), sincroniza entre aparelhos ---------- */
const CLOUD_KEY = "semana.cloud", CLOUD_FILE = "semana.json", CLOUD_DEFAULT_REPO = "obardomoderno/meus-dados";
function cloudCfg() { try { return JSON.parse(localStorage.getItem(CLOUD_KEY) || "null"); } catch (e) { return null; } }
function cloudSaveCfg(c) { try { if (c) localStorage.setItem(CLOUD_KEY, JSON.stringify(c)); else localStorage.removeItem(CLOUD_KEY); } catch (e) { /* ok */ } }
const b64utf8 = str => { const bytes = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
const utf8b64 = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, "")), c => c.charCodeAt(0)));
function cloudReq(cfg, method, body) {
  return fetch("https://api.github.com/repos/" + cfg.repo + "/contents/" + CLOUD_FILE + (method === "GET" ? "?t=" + Date.now() : ""), { method, cache: "no-store",
    headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + cfg.token, ...(body ? { "Content-Type": "application/json" } : {}) }, body: body ? JSON.stringify(body) : undefined });
}
function mergeRemote(R) {
  let changed = false;
  Object.entries(R.days || {}).forEach(([k, d]) => { const L = S.days[k]; if (!L || (d.mt || 0) > (L.mt || 0)) { S.days[k] = d; changed = true; } });
  if (R.settings && (R.settings.mt || 0) > (S.settings.mt || 0)) { S.settings = { ...blank().settings, ...R.settings }; changed = true; }
  if (R.hab && Array.isArray(R.hab.list) && (R.hab.mt || 0) > (S.hab.mt || 0)) { S.hab = R.hab; changed = true; }
  Object.entries(R.jr || {}).forEach(([k, d]) => { const L = S.jr[k]; if (!L || (d.mt || 0) > (L.mt || 0)) { S.jr[k] = d; changed = true; } });
  return changed;
}
function sameAs(R) {
  if (!R || !R.days) return false;
  const a = S.days, b = R.days, ks = new Set([...Object.keys(a), ...Object.keys(b)]);
  for (const k of ks) if (!a[k] || !b[k] || (a[k].mt || 0) !== (b[k].mt || 0)) return false;
  const ja = S.jr, jb = R.jr || {}, jk = new Set([...Object.keys(ja), ...Object.keys(jb)]);
  for (const k of jk) if (!ja[k] || !jb[k] || (ja[k].mt || 0) !== (jb[k].mt || 0)) return false;
  if ((S.hab.mt || 0) !== ((R.hab && R.hab.mt) || 0)) return false;
  return (S.settings.mt || 0) === ((R.settings && R.settings.mt) || 0);
}
let cloudT = null, cloudBusy = false, cloudAgain = false;
function cloudSoon(ms) { if (!cloudCfg()) return; clearTimeout(cloudT); cloudT = setTimeout(cloudSync, ms ?? 3000); }
function cloudErr(status) { return status === 401 || status === 403 ? "O GitHub recusou a chave. Gere outra e ative de novo." : status === 404 ? "Repositório não encontrado ou sem acesso." : "O GitHub respondeu com erro " + status + "."; }
async function cloudSync() {
  const cfg = cloudCfg(); if (!cfg || navigator.onLine === false) return;
  if (cloudBusy) { cloudAgain = true; return; } cloudBusy = true;
  const set = patch => { const c = cloudCfg(); if (c) cloudSaveCfg({ ...c, ...patch }); };
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      const g = await cloudReq(cfg, "GET");
      let sha = null, remote = null;
      if (g.ok) { const j = await g.json(); sha = j.sha; try { remote = JSON.parse(utf8b64(j.content || "")); } catch (e) { remote = null; } }
      else if (g.status !== 404) { set({ err: cloudErr(g.status) }); return; }
      if (remote && remote.data && mergeRemote(remote.data)) { saveNow(); if (!dragging) render(); }
      if (remote && sameAs(remote.data)) { set({ err: "", last: Date.now() }); return; }
      const p = await cloudReq(cfg, "PUT", { message: "Atualiza " + CLOUD_FILE, content: b64utf8(JSON.stringify({ app: "semana", updatedAt: new Date().toISOString(), data: S }, null, 1)), ...(sha ? { sha } : {}) });
      if (p.ok) { set({ err: "", last: Date.now() }); return; }
      if (p.status !== 409 && p.status !== 422) { set({ err: cloudErr(p.status) }); return; }
    }
  } catch (e) { /* sem conexão: tenta depois */ }
  finally { cloudBusy = false; if (cloudAgain) { cloudAgain = false; cloudSoon(1500); } }
}
addEventListener("online", () => cloudSoon(800));
document.addEventListener("visibilitychange", () => { if (cloudCfg()) { clearTimeout(cloudT); cloudSync(); } });
setInterval(() => { if (document.visibilityState === "visible" && cloudCfg()) cloudSync(); }, 60000);
function borrowedKey() {
  for (const k of ["diario.cloud", "ponteiro.cloud"]) { try { const c = JSON.parse(localStorage.getItem(k) || "null"); if (c && c.token && typeof c.token === "string") return { token: c.token, repo: c.repo || CLOUD_DEFAULT_REPO }; } catch (e) { /* ok */ } }
  return null;
}
function cloudSetup() {
  const c = cloudCfg();
  if (c) {
    const el = openSheet(`<h3>Cópia no GitHub</h3>
      <p class="hint">${esc(c.err || (c.last ? "Sincronizada " + new Date(c.last).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "Ativa"))}</p>
      <p class="hint">${esc(c.repo)} · ${CLOUD_FILE}</p>
      <div class="foot"><button class="btn danger" id="c_off">Desativar</button><button class="btn primary wide" id="c_now">Sincronizar agora</button></div>`);
    $("#c_now", el).onclick = async () => { $("#c_now", el).disabled = true; await cloudSync(); closeSheet(true); const cc = cloudCfg(); toast(cc && cc.err ? cc.err : "Sincronizado"); };
    $("#c_off", el).onclick = ev => arm(ev.currentTarget, "Toque de novo", () => { cloudSaveCfg(null); closeSheet(true); toast("Cópia desativada"); });
    return;
  }
  const bk = borrowedKey();
  const el = openSheet(`<h3>Cópia no GitHub</h3>
    <div class="lab" style="margin-top:0">Repositório privado</div><input class="fld" id="c_repo" autocapitalize="off" spellcheck="false" value="${esc(bk ? bk.repo : CLOUD_DEFAULT_REPO)}">
    <div class="lab">Chave do GitHub</div><input class="fld" id="c_tok" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(bk ? bk.token : "")}">
    ${bk ? `<p class="hint">Usando a mesma chave do Diário.</p>` : ""}
    <p class="hint" id="c_msg"></p>
    <div class="foot"><button class="btn primary wide" id="c_ok">Ativar</button></div>`);
  $("#c_ok", el).onclick = async () => {
    const msg = t => { $("#c_msg", el).textContent = t; };
    const repo = $("#c_repo", el).value.trim().replace(/^https?:\/\/github\.com\//, "").replace(/\/$/, ""), token = $("#c_tok", el).value.trim();
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { msg("Use o formato usuario/repositorio."); return; }
    if (!token) { msg("Cole a chave."); return; }
    msg("Conectando…");
    let r; try { r = await fetch("https://api.github.com/repos/" + repo, { cache: "no-store", headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + token } }); } catch (e) { msg("Sem conexão com o GitHub."); return; }
    if (!r.ok) { msg(cloudErr(r.status)); return; }
    cloudSaveCfg({ repo, token }); await cloudSync();
    const cc = cloudCfg(); if (cc && cc.err) { msg(cc.err); return; }
    closeSheet(true); render(); toast("Sincronizado");
  };
}

/* ---------- toast ---------- */
function toast(msg, label, fn) {
  const r = $("#toastRoot"); r.innerHTML = `<div class="toast"><span>${esc(msg)}</span>${label ? `<button>${esc(label)}</button>` : ""}</div>`;
  if (label) r.querySelector("button").onclick = () => { r.innerHTML = ""; fn(); };
  clearTimeout(toast.t); toast.t = setTimeout(() => { r.innerHTML = ""; }, label ? 5000 : 2200);
}

/* ---------- eventos ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, li = b.closest(".it");
  if (act === "day") { UI.day = b.dataset.k; render(); }
  else if (act === "prevw") { UI.day = addDays(UI.day, -7); render(); }
  else if (act === "nextw") { UI.day = addDays(UI.day, 7); render(); }
  else if (act === "today") { UI.day = todayKey(); render(); }
  else if (act === "summary") openSummary();
  else if (act === "menu") { if (UI.tab === "plan") openMenu(); else openSettings(); }
  else if (act === "tab") { UI.tab = b.dataset.k; try { localStorage.setItem("semana.tab", UI.tab); } catch (err) { /* ok */ } scrollTo(0, 0); render(); }
  else if (act === "newj") openEntry(UI.day, null);
  else if (act === "openj") openEntry(UI.day, b.dataset.id);
  else if (act === "hjump") { const dm = doneMap(UI.day)[b.dataset.h]; if (dm) openEntry(UI.day, dm.entry); else openEntry(UI.day, null, b.dataset.h); }
  else if (act === "openh") openHabit(b.dataset.id);
  else if (act === "edit" && li) openEdit(li.dataset.id);
  else if (act === "done" && li) { const it = items(UI.day).find(x => x.id === li.dataset.id); if (it) { it.done = !it.done; commit(UI.day); } }
});
document.addEventListener("keydown", e => {
  const pk = $("#pkRoot").firstElementChild;
  if (pk) { if (e.key === "Escape") pk.click(); else if (e.key === "Enter") { e.preventDefault(); pk._ok(); } return; }
  if (e.key === "Escape" && $("#layer").firstElementChild) { closeSheet(); return; }
  if ($("#layer").firstElementChild || /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  if (e.key === "ArrowLeft") { UI.day = addDays(UI.day, -1); render(); }
  else if (e.key === "ArrowRight") { UI.day = addDays(UI.day, 1); render(); }
  else if (e.key === "n") { e.preventDefault(); if (UI.tab === "plan") form.n.focus(); else if (UI.tab === "hab") $("#hadd").n.focus(); else openEntry(UI.day, null); }
  else if (e.key === "t") { UI.day = todayKey(); render(); }
});

/* arrastar para reordenar */
const listEl = $("#list"); let drag = null, dragging = false;
listEl.addEventListener("pointerdown", e => {
  const g = e.target.closest(".grip"); if (!g) return;
  e.preventDefault(); const el = g.closest(".it");
  drag = { el, y0: e.clientY, off0: el.offsetTop }; dragging = true;
  try { g.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
  el.classList.add("dragging");
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  const el = drag.el, place = () => { el.style.transform = `translateY(${e.clientY - drag.y0 - (el.offsetTop - drag.off0)}px)`; };
  place();
  const r = el.getBoundingClientRect(), mid = r.top + r.height / 2, prev = el.previousElementSibling, next = el.nextElementSibling;
  /* move sempre o vizinho, nunca o item arrastado, para não perder o toque */
  if (prev) { const p = prev.getBoundingClientRect(); if (mid < p.top + p.height / 2) { listEl.insertBefore(prev, el.nextSibling); place(); return; } }
  if (next) { const n = next.getBoundingClientRect(); if (mid > n.top + n.height / 2) { listEl.insertBefore(next, el); place(); } }
});
const endDrag = () => {
  if (!drag) return; const el = drag.el; drag = null; dragging = false;
  el.classList.remove("dragging"); el.style.transform = "";
  const order = [...listEl.children].map(x => x.dataset.id), list = items(UI.day);
  const sorted = order.map(id => list.find(x => x.id === id)).filter(Boolean);
  if (sorted.some((x, i) => x !== list[i])) setDay(UI.day, sorted);
  render();
};
document.addEventListener("pointerup", endDrag); document.addEventListener("pointercancel", endDrag);

/* deslizar para trocar de dia */
let sw = null;
const swipeZone = e => e.target.closest("#day,#v-jr");
document.addEventListener("touchstart", e => { if (!swipeZone(e)) { sw = null; return; } if (e.touches.length !== 1 || e.target.closest(".grip,input,textarea")) { sw = null; return; } const t = e.touches[0]; sw = { x: t.clientX, y: t.clientY, t: Date.now() }; }, { passive: true });
document.addEventListener("touchend", e => {
  if (!sw || dragging || overlay()) { sw = null; return; } const t = e.changedTouches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 45 && Date.now() - sw.t < 700) { UI.day = addDays(UI.day, dx < 0 ? 1 : -1); render(); }
  sw = null;
}, { passive: true });

load(); render();
setInterval(() => { if (!dragging && !overlay()) render(); }, 30000);
if (cloudCfg()) setTimeout(cloudSync, 400);

/* atualização automática */
const BUILD = "20261025180000";
window.APP_BUILD = (b => { if (!/^\d{14}$/.test(b)) return ""; const d = new Date(Date.UTC(+b.slice(0, 4), +b.slice(4, 6) - 1, +b.slice(6, 8), +b.slice(8, 10), +b.slice(10, 12))); return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); })(BUILD);
let swReg = null;
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(r => { swReg = r; }).catch(() => {}));
async function checkUpdate() {
  if (navigator.onLine === false) return;
  try { if (swReg) swReg.update(); } catch (e) { /* ok */ }
  let latest = null;
  try { const h = await (await fetch("./?u=" + Date.now(), { cache: "no-store" })).text(); const m = h.match(/const BUILD = "([0-9]+)"/); latest = m && m[1]; } catch (e) { return; }
  if (!latest || latest === BUILD) return;
  if (overlay() || dragging || document.activeElement.closest("#add")) { setTimeout(checkUpdate, 15000); return; }
  try { if (sessionStorage.getItem("semana.updatedTo") === latest) return; sessionStorage.setItem("semana.updatedTo", latest); } catch (e) { /* ok */ }
  saveNow(); location.reload();
}
setTimeout(checkUpdate, 2500);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { checkUpdate(); if (!dragging && !overlay()) render(); } });
setInterval(checkUpdate, 5 * 60 * 1000);
</script>
