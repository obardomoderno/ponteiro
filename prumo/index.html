<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2E5E4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prumo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Prumo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: coluna de app (máx. 560px), cabeçalho no topo, abas embaixo, editores em tela cheia por cima. */
:root{
  color-scheme:light; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF1EE; --surface:#FFFFFF; --sunk:#E1E8E3; --ink:#18231E; --muted:#58665F; --line:#D2DCD6;
  --accent:#2E5E4E; --accent-ink:#FFFFFF; --accent-soft:#D6E7DF;
  --good:#2E7D4F; --mid:#C08A1E; --bad:#C24A3A;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --body:"Atkinson Hyperlegible","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(24,35,30,.06),0 4px 14px rgba(24,35,30,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#18211C; --sunk:#121A16; --ink:#E3ECE7; --muted:#97A69E; --line:#26332C;
  --accent:#6FBF9D; --accent-ink:#0B1B14; --accent-soft:#1C3A2E; --good:#6CC08A; --mid:#E0B24E; --bad:#EF7E6E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18211C; --sunk:#121A16; --ink:#E3ECE7; --muted:#97A69E; --line:#26332C;
  --accent:#6FBF9D; --accent-ink:#0B1B14; --accent-soft:#1C3A2E; --good:#6CC08A; --mid:#E0B24E; --bad:#EF7E6E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.locked{overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.em{font-family:var(--emoji);line-height:1}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px}
.sub{color:var(--muted);font-size:13px}
main{flex:1;padding-block:4px 110px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.section{display:flex;flex-direction:column;gap:10px}
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:16px;font-size:14px;text-align:center}
.small{font-size:13px;color:var(--muted)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
nav.tabs button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);min-width:0}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;flex:none;color:var(--ink)}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chipbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--ink)}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Início */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:118px;height:118px}
.ring text{font-family:var(--mono);fill:var(--ink)}
.hero .facts{display:flex;flex-direction:column;gap:4px;min-width:0}
.hero .facts b{font-family:var(--display);font-size:20px}
.wheelwrap{display:flex;justify-content:center}
.wheel{width:min(320px,86vw);max-width:100%;aspect-ratio:1}
.wheel .lbl{font-family:var(--emoji);font-size:14px}
.wheel .pc{font-family:var(--mono);font-size:8.5px;fill:var(--muted)}
.wheel path{cursor:pointer}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px}
.leg{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:none;border:0;text-align:left;padding:6px 0;min-width:0}
.leg .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg .v{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.moodrow{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:64px}
.moodrow i{display:block;border-radius:4px 4px 2px 2px;background:var(--c,var(--sunk));min-height:4px}
.moodaxis{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center}
.habrow{display:flex;flex-wrap:wrap;gap:8px}
.habchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px}
.habchip.on{background:color-mix(in srgb,var(--good) 18%,var(--surface));border-color:var(--good)}
.habchip .ck{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.habchip.on .ck{background:var(--good);border-color:var(--good)}
.habchip .ck svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:3;opacity:0}
.habchip.on .ck svg{opacity:1}
.ask{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);padding:16px 18px;font-family:var(--display);font-size:18px;font-weight:700;box-shadow:var(--shadow);text-align:left}
.ask .faces{font-family:var(--emoji);font-size:22px;letter-spacing:2px}

/* Diário */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.mood .f{font-family:var(--emoji);font-size:30px;line-height:1}
.mood[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--ink);font-weight:700}
.feed{display:flex;flex-direction:column;gap:8px}
.dayh{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:8px}
.entry{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;width:100%;text-align:left;background:var(--surface);border:0;border-left:4px solid var(--c);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px}
.entry .f{font-family:var(--emoji);font-size:26px;grid-row:1 / span 3;line-height:1}
.entry .t{font-family:var(--mono);font-size:12px;color:var(--muted)}
.entry .x{overflow-wrap:anywhere;white-space:pre-wrap}

/* Pendências */
.areabars{display:flex;flex-direction:column;gap:10px}
.abar{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;background:none;border:0;text-align:left;padding:0;width:100%}
.abar .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.abar .v{font-family:var(--mono);font-variant-numeric:tabular-nums}
.meter{grid-column:1 / -1;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--c,var(--accent));border-radius:4px;transition:width .25s}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface);grid-row:1 / span 2}
.task .box svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.task.done .box{background:var(--good);border-color:var(--good)}
.task.done .box svg{opacity:1}
.task .tt{min-width:0;overflow-wrap:anywhere;background:none;border:0;text-align:left;padding:0}
.task.done .tt{color:var(--muted);text-decoration:line-through}
.task .meta{grid-column:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.task .w{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* Hábitos */
.habit{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.habit:first-child{border-top:0}
.habit .hn{display:flex;align-items:center;gap:8px;min-width:0;background:none;border:0;padding:0;text-align:left;font-weight:700}
.habit .hn span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.habit .streak{font-family:var(--mono);font-size:13px;color:var(--muted)}
.week{grid-column:1 / -1;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dayck{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;font-size:10px;color:var(--muted);font-family:var(--mono)}
.dayck i{width:30px;height:30px;border-radius:9px;background:var(--sunk);display:grid;place-items:center;border:2px solid transparent}
.dayck.on i{background:var(--c,var(--good))}
.dayck.today i{border-color:var(--ink)}
.dayck i svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;opacity:0}
.dayck.on i svg{opacity:1}
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--sunk)}

/* Mais */
.form{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.field:first-child{border-top:0}
.field .l{font-weight:700}
.dsel{font-size:16px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.arow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--c) 22%,var(--surface))}
.arow .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;text-align:left;padding:0}

/* telas cheias */
.fs{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.fsbar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.fsbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-block:10px}
.fsbar .in > :first-child{justify-self:start}
.fsbar .in > :last-child{justify-self:end}
.fsbar h3{font-family:var(--display);font-size:17px;margin:0;font-weight:700;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52vw}
.fsbody{max-width:560px;margin:0 auto;padding-block:18px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.fsbody label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.fsbody input[type=text],.fsbody select,.fsbody textarea{box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-weight:400;font-size:16px;color:var(--ink);width:100%;max-width:100%;min-width:0}
.fsbody textarea{min-height:140px;resize:vertical;line-height:1.5}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;background:var(--c)}
.swatches button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--bg)}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px}
.emojis button{height:44px;border-radius:10px;border:1px solid transparent;background:var(--surface);font-size:22px;font-family:var(--emoji)}
.emojis button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sheetbar{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>
<div class="app">
  <header class="top gutter" id="top"></header>
  <main class="gutter" id="main"></main>
</div>
<nav class="tabs" aria-label="Seções"><div class="in" id="tabs"></div></nav>
<div id="layers"></div>
<div id="toastRoot" aria-live="polite"></div>
<script>
"use strict";
/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const HOUR = 36e5, DAY = 864e5;
const pad = n => String(n).padStart(2, "0");
const now = () => Date.now();
const MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const DIAS = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
const fmtHM = ms => { const d = new Date(ms); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };

/* ---------- estado (salvo neste aparelho) ---------- */
const KEY = "prumo.v1";
const COLORS = ["#2E7D4F", "#3E92CC", "#C2378D", "#F3A712", "#E4572E", "#6C4AB6", "#0B9A93", "#8D6A4F", "#D9455F", "#2F5BEA", "#9BBF5A", "#6B7C85"];
const AREA_EMOJIS = ["💰", "❤️", "🎨", "👨‍👩‍👧", "👧", "💑", "💼", "🏠", "🧠", "🙏", "📚", "🏋️", "🌱", "🎵", "🎮", "✈️", "🍽️", "🐶", "🚗", "🧘", "⚽", "🎓", "🛠️", "⭐"];
const MOODS = [{ v: 5, f: "😄", n: "Ótimo", c: "#2E7D4F" }, { v: 4, f: "🙂", n: "Bem", c: "#7BAE4F" }, { v: 3, f: "😐", n: "Ok", c: "#C9A227" }, { v: 2, f: "😕", n: "Mal", c: "#E07B39" }, { v: 1, f: "😢", n: "Péssimo", c: "#C24A3A" }];
const FEELINGS = ["Grato", "Feliz", "Calmo", "Motivado", "Orgulhoso", "Amado", "Cansado", "Ansioso", "Estressado", "Triste", "Irritado", "Sozinho", "Preocupado", "Entediado"];
const WEIGHTS = [[1, "Leve"], [2, "Média"], [3, "Pesada"]];
const defaultAreas = () => [["Finanças", "💰", "#2E7D4F"], ["Saúde", "❤️", "#D9455F"], ["Hobbies", "🎨", "#6C4AB6"], ["Família", "👨‍👩‍👧", "#F3A712"], ["Filha", "👧", "#C2378D"], ["Kamy", "💑", "#3E92CC"]].map(([name, icon, color], i) => ({ id: uid(), name, icon, color, order: i }));
let S = { areas: [], diary: [], tasks: [], habits: [], checks: {}, settings: { dayEndHour: 0 } };
const UI = { tab: "home", taskArea: "all", showDone: false };
function load() {
  let raw = null; try { raw = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { raw = null; }
  if (raw) S = { ...S, ...raw, settings: { dayEndHour: 0, ...(raw.settings || {}) } };
  else { S.areas = defaultAreas(); save(); }
}
let saveT = null;
function save() { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast("Não foi possível salvar neste aparelho."); } }, 250); }
addEventListener("pagehide", () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ok */ } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ok */ } } });

/* dia do app: termina na hora escolhida em Mais (ex.: 05:00) */
const dayOff = () => (S.settings.dayEndHour || 0) * HOUR;
const sod = ms => { const o = dayOff(); const d = new Date(ms - o); d.setHours(0, 0, 0, 0); return d.getTime() + o; };
const addDays = (ms, n) => { const d = new Date(ms); d.setDate(d.getDate() + n); return d.getTime(); };
const dayKey = ms => { const d = new Date(sod(ms)); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
function fmtDay(ms) {
  const d = new Date(sod(ms)), t = sod(now());
  if (sod(ms) === t) return "Hoje";
  if (sod(ms) === addDays(t, -1)) return "Ontem";
  return DIAS[d.getDay()][0].toUpperCase() + DIAS[d.getDay()].slice(1) + ", " + d.getDate() + " de " + MESES[d.getMonth()];
}
const areaById = id => S.areas.find(a => a.id === id);
const areasSorted = () => [...S.areas].sort((a, b) => a.order - b.order);

/* ---------- saúde: pendências resolvidas + hábitos cumpridos nos últimos 7 dias ---------- */
function taskPct(areaId) { const ts = S.tasks.filter(t => !areaId || t.areaId === areaId); const tot = ts.reduce((s, t) => s + t.weight, 0); if (!tot) return null; return ts.filter(t => t.done).reduce((s, t) => s + t.weight, 0) / tot; }
function habitPct(areaId) {
  const hs = S.habits.filter(h => !areaId || h.areaId === areaId); if (!hs.length) return null;
  let done = 0, tot = 0; const t = sod(now());
  for (let i = 0; i < 7; i++) { const k = dayKey(addDays(t, -i)); for (const h of hs) { if (h.createdAt && sod(h.createdAt) > addDays(t, -i)) continue; tot++; if ((S.checks[k] || []).includes(h.id)) done++; } }
  return tot ? done / tot : null;
}
function areaScore(areaId) { const v = [taskPct(areaId), habitPct(areaId)].filter(x => x !== null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; }
function overallScore() { const v = S.areas.map(a => areaScore(a.id)).filter(x => x !== null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; }
const pctTxt = v => v === null ? "—" : Math.round(v * 100) + "%";
const scoreColor = v => v === null ? "var(--muted)" : v >= .7 ? "var(--good)" : v >= .4 ? "var(--mid)" : "var(--bad)";
function streak(h) { let n = 0; let d = sod(now()); if (!(S.checks[dayKey(d)] || []).includes(h.id)) d = addDays(d, -1); while ((S.checks[dayKey(d)] || []).includes(h.id)) { n++; d = addDays(d, -1); } return n; }

const moodOf = v => MOODS.find(m => m.v === v);

function ringSVG(v) {
  const R = 46, C = 2 * Math.PI * R, len = v === null ? 0 : v * C;
  return `<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="Saúde geral ${pctTxt(v)}"><circle r="${R}" cx="60" cy="60" fill="none" stroke="var(--sunk)" stroke-width="12"></circle>
    <circle r="${R}" cx="60" cy="60" fill="none" stroke="${scoreColor(v)}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${len.toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)"></circle>
    <text x="60" y="66" text-anchor="middle" font-size="22" font-weight="500">${pctTxt(v)}</text></svg>`;
}
/* roda da vida: uma fatia por núcleo, o raio mostra a saúde do núcleo */
function wheelSVG() {
  const as = areasSorted(); const n = as.length; if (!n) return "";
  const cx = 110, cy = 110, R0 = 22, R1 = 92; let g = "";
  for (const f of [.25, .5, .75, 1]) g += `<circle cx="${cx}" cy="${cy}" r="${(R0 + (R1 - R0) * f).toFixed(1)}" fill="none" stroke="var(--line)" stroke-width="${f === 1 ? 1 : .6}"></circle>`;
  as.forEach((a, i) => {
    const a0 = -Math.PI / 2 + i * 2 * Math.PI / n + .02, a1 = -Math.PI / 2 + (i + 1) * 2 * Math.PI / n - .02;
    const v = areaScore(a.id); const r = R0 + (R1 - R0) * (v === null ? 0 : Math.max(.03, v));
    const p = (rad, ang) => [cx + rad * Math.cos(ang), cy + rad * Math.sin(ang)].map(x => x.toFixed(2)).join(" ");
    const large = a1 - a0 > Math.PI ? 1 : 0;
    g += `<path d="M ${p(R0, a0)} L ${p(r, a0)} A ${r} ${r} 0 ${large} 1 ${p(r, a1)} L ${p(R0, a1)} A ${R0} ${R0} 0 ${large} 0 ${p(R0, a0)} Z" fill="${a.color}" fill-opacity="${v === null ? .15 : .85}" data-act="area" data-id="${a.id}"><title>${esc(a.name)}: ${pctTxt(v)}</title></path>`;
    const mid = (a0 + a1) / 2; const lr = R1 + 12;
    g += `<text class="lbl" x="${(cx + lr * Math.cos(mid)).toFixed(1)}" y="${(cy + lr * Math.sin(mid) + 5).toFixed(1)}" text-anchor="middle">${esc(a.icon)}</text>`;
  });
  return `<svg class="wheel" viewBox="-6 -6 232 232" role="img" aria-label="Roda dos núcleos">${g}<circle cx="${cx}" cy="${cy}" r="${R0 - 3}" fill="var(--surface)"></circle></svg>`;
}
function moodBars() {
  const t = sod(now()); let bars = "", axis = "";
  for (let i = 13; i >= 0; i--) {
    const d0 = addDays(t, -i), d1 = addDays(d0, 1); const es = S.diary.filter(e => e.mood && e.at >= d0 && e.at < d1);
    const avg = es.length ? es.reduce((s, e) => s + e.mood, 0) / es.length : null; const m = avg === null ? null : moodOf(Math.round(avg));
    bars += `<i style="height:${avg === null ? 4 : (avg / 5 * 100).toFixed(0)}%;${m ? "--c:" + m.c : ""}" title="${esc(fmtDay(d0))}${m ? ": " + m.n : ""}"></i>`;
    axis += `<span>${new Date(d0).getDate()}</span>`;
  }
  return `<div class="moodrow" role="img" aria-label="Humor dos últimos 14 dias">${bars}</div><div class="moodaxis">${axis}</div>`;
}
function viewHome() {
  const ov = overallScore(); const open = S.tasks.filter(t => !t.done).length;
  const wk = S.diary.filter(e => e.mood && e.at >= addDays(sod(now()), -6)); const mAvg = wk.length ? moodOf(Math.round(wk.reduce((s, e) => s + e.mood, 0) / wk.length)) : null;
  const todayK = dayKey(now()); const doneToday = S.checks[todayK] || [];
  const habits = S.habits.map(h => { const a = areaById(h.areaId); const on = doneToday.includes(h.id); return `<button class="habchip ${on ? "on" : ""}" data-act="hcheck" data-id="${h.id}" data-k="${todayK}" aria-pressed="${on}"><span class="ck">${ICON.check}</span><span class="em">${esc(h.icon || (a && a.icon) || "⭐")}</span>${esc(h.name)}</button>`; }).join("");
  const legend = areasSorted().map(a => { const v = areaScore(a.id); return `<button class="leg" style="--c:${a.color}" data-act="area" data-id="${a.id}"><span class="dot"></span><span class="nm"><span class="em">${esc(a.icon)}</span> ${esc(a.name)}</span><span class="v">${pctTxt(v)}</span></button>`; }).join("");
  return `<button class="ask" data-act="newentry"><span>Como você está agora?</span><span class="faces">😄🙂😐😕😢</span></button>
  <div class="card hero">${ringSVG(ov)}<div class="facts"><span class="sub">Saúde geral da vida</span><b>${ov === null ? "Comece pelos núcleos" : ov >= .7 ? "No prumo" : ov >= .4 ? "Pedindo atenção" : "Fora do prumo"}</b>
    <span class="sub">${open} ${open === 1 ? "pendência aberta" : "pendências abertas"} · humor da semana ${mAvg ? `<span class="em">${mAvg.f}</span> ${mAvg.n}` : "—"}</span></div></div>
  <section class="section"><h2>Núcleos</h2><div class="card"><div class="wheelwrap">${wheelSVG()}</div><div class="legend">${legend}</div></div></section>
  <section class="section"><div class="rowhead"><h2>Hábitos de hoje</h2><button class="btn ghost" data-act="tab" data-k="habits">Ver todos</button></div>${habits ? `<div class="habrow">${habits}</div>` : `<div class="empty">Nenhum hábito. <button class="btn ghost" data-act="newhabit">Criar o primeiro</button></div>`}</section>
  <section class="section"><h2>Humor · 14 dias</h2><div class="card">${moodBars()}</div></section>`;

function viewDiary() {
  const sorted = [...S.diary].sort((a, b) => b.at - a.at); let feed = "", last = null;
  for (const e of sorted.slice(0, 200)) {
    const d = sod(e.at); if (d !== last) { feed += `<div class="dayh">${esc(fmtDay(e.at))}</div>`; last = d; }
    const m = moodOf(e.mood);
    feed += `<button class="entry" style="--c:${m ? m.c : "var(--line)"}" data-act="editentry" data-id="${e.id}"><span class="f">${m ? m.f : "📝"}</span><span class="t">${fmtHM(e.at)}${m ? " · " + m.n : ""}</span>
      ${e.feelings && e.feelings.length ? `<span class="chips">${e.feelings.map(f => `<span class="tag" style="--c:var(--accent)">${esc(f)}</span>`).join("")}</span>` : ""}
      ${e.text ? `<span class="x">${esc(e.text)}</span>` : ""}
      ${e.areas && e.areas.length ? `<span class="chips">${e.areas.map(id => areaById(id)).filter(Boolean).map(a => `<span class="tag" style="--c:${a.color}"><span class="em">${esc(a.icon)}</span>${esc(a.name)}</span>`).join("")}</span>` : ""}</button>`;
  }

  <section class="section"><h2>Registros</h2>${feed ? `<div class="feed">${feed}</div>` : `<div class="empty">Nenhum registro.</div>`}</section>`;
}

function viewTasks() {
  const as = areasSorted();
  const bars = as.map(a => { const v = taskPct(a.id); const open = S.tasks.filter(t => t.areaId === a.id && !t.done).length; return `<button class="abar" style="--c:${a.color}" data-act="taskarea" data-k="${a.id}"><span class="em">${esc(a.icon)}</span><span class="nm">${esc(a.name)} <span class="sub">${open ? open + " aberta" + (open > 1 ? "s" : "") : ""}</span></span><span class="v">${pctTxt(v)}</span><span class="meter"><span style="width:${v === null ? 0 : (v * 100).toFixed(1)}%"></span></span></button>`; }).join("");
  const filter = `<div class="chips"><button class="chipbtn" data-act="taskarea" data-k="all" aria-pressed="${UI.taskArea === "all"}">Todas</button>${as.map(a => `<button class="chipbtn" data-act="taskarea" data-k="${a.id}" aria-pressed="${UI.taskArea === a.id}"><span class="em">${esc(a.icon)}</span>${esc(a.name)}</button>`).join("")}</div>`;
  const ts = S.tasks.filter(t => UI.taskArea === "all" || t.areaId === UI.taskArea);
  const row = t => { const a = areaById(t.areaId); return `<div class="task ${t.done ? "done" : ""}"><button class="box" data-act="tdone" data-id="${t.id}" aria-label="${t.done ? "Reabrir" : "Resolver"} ${esc(t.title)}" aria-pressed="${t.done}">${ICON.check}</button><button class="tt" data-act="edittask" data-id="${t.id}">${esc(t.title)}</button><span></span>
    <span class="meta">${a ? `<span class="tag" style="--c:${a.color}"><span class="em">${esc(a.icon)}</span>${esc(a.name)}</span>` : ""}<span class="w">${"●".repeat(t.weight)}${"○".repeat(3 - t.weight)}</span></span></div>`; };
  const open = ts.filter(t => !t.done).sort((a, b) => b.weight - a.weight || a.createdAt - b.createdAt), done = ts.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  return `<section class="section"><h2>Saúde por núcleo</h2><div class="card areabars">${bars || `<span class="small">Crie núcleos em Mais.</span>`}</div></section>
  <section class="section"><div class="rowhead"><h2>Pendências</h2><button class="btn primary" data-act="newtask">${ICON.plus} Nova</button></div>${filter}
  ${open.length ? `<div class="list">${open.map(row).join("")}</div>` : `<div class="empty">Nenhuma pendência aberta.</div>`}</section>
  ${done.length ? `<section class="section"><div class="rowhead"><h2>Resolvidas (${done.length})</h2><button class="btn ghost" data-act="toggledone">${UI.showDone ? "Esconder" : "Mostrar"}</button></div>${UI.showDone ? `<div class="list">${done.map(row).join("")}</div>` : ""}</section>` : ""}`;
}

function viewHabits() {
  const t = sod(now());
  const rows = S.habits.map(h => {
    const a = areaById(h.areaId); let week = "";
    for (let i = 6; i >= 0; i--) { const d = addDays(t, -i), k = dayKey(d), on = (S.checks[k] || []).includes(h.id); week += `<button class="dayck ${on ? "on" : ""} ${i === 0 ? "today" : ""}" style="--c:${a ? a.color : "var(--good)"}" data-act="hcheck" data-id="${h.id}" data-k="${k}" aria-pressed="${on}" aria-label="${esc(h.name)}, ${esc(fmtDay(d))}"><i>${ICON.check}</i>${DIAS[new Date(d).getDay()].slice(0, 1).toUpperCase()}</button>`; }
    const s = streak(h);
    return `<div class="habit"><button class="hn" data-act="edithabit" data-id="${h.id}"><span class="em">${esc(h.icon || (a && a.icon) || "⭐")}</span><span>${esc(h.name)}</span></button><span class="streak">${s ? "🔥 " + s + (s === 1 ? " dia" : " dias") : ""}</span><div class="week">${week}</div></div>`;
  }).join("");
  let heat = "";
  if (S.habits.length) for (let i = 29; i >= 0; i--) { const d = addDays(t, -i), k = dayKey(d); const hs = S.habits.filter(h => !h.createdAt || sod(h.createdAt) <= d); const v = hs.length ? (S.checks[k] || []).filter(id => hs.some(h => h.id === id)).length / hs.length : 0; heat += `<i style="background:${v ? `color-mix(in srgb,var(--good) ${Math.round(25 + v * 75)}%,var(--sunk))` : "var(--sunk)"}" title="${esc(fmtDay(d))}: ${Math.round(v * 100)}%"></i>`; }
  return `<section class="section"><div class="rowhead"><h2>Hábitos</h2><button class="btn primary" data-act="newhabit">${ICON.plus} Novo</button></div>
  ${rows ? `<div class="list">${rows}</div>` : `<div class="empty">Nenhum hábito.</div>`}</section>
  ${heat ? `<section class="section"><h2>Consistência · 30 dias</h2><div class="card"><div class="heat">${heat}</div></div></section>` : ""}`;
}

function viewMore() {

/* ---------- telas cheias ---------- */
function openLayer(title, body, opts = {}) {
  const el = document.createElement("div"); el.className = "fs"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); el.setAttribute("aria-label", title);
  const left = opts.left ?? `<button class="btn ghost" data-act="close">Cancelar</button>`;
  const right = opts.okLabel ? `<button class="btn primary" data-ok>${esc(opts.okLabel)}</button>` : `<span></span>`;
  el.innerHTML = `<div class="fsbar gutter"><div class="in">${left}<h3>${esc(title)}</h3>${right}</div></div><div class="fsbody gutter">${body}</div>`;
  $("#layers").appendChild(el); document.body.classList.add("locked");
  if (opts.onMount) opts.onMount(el);
  return el;
}
function closeLayer(el) { (el || $("#layers").lastElementChild)?.remove(); if (!$("#layers").children.length) document.body.classList.remove("locked"); }
function armButton(btn, label, fn) { if (btn.classList.contains("armed")) { fn(); return; } btn.dataset.orig = btn.textContent; btn.classList.add("armed"); btn.textContent = label; setTimeout(() => { if (btn.isConnected) { btn.classList.remove("armed"); btn.textContent = btn.dataset.orig; } }, 3500); }
const areaChips = (sel, multi) => `<div class="chips" data-areas="${multi ? "multi" : "one"}">${areasSorted().map(a => `<button type="button" class="chipbtn" data-aid="${a.id}" aria-pressed="${sel.includes(a.id)}"><span class="em">${esc(a.icon)}</span>${esc(a.name)}</button>`).join("")}</div>`;
function wireChips(el, sel, multi) {
  el.querySelector("[data-areas]").onclick = e => { const b = e.target.closest("[data-aid]"); if (!b) return; const id = b.dataset.aid;
    if (multi) { const i = sel.indexOf(id); if (i >= 0) sel.splice(i, 1); else sel.push(id); } else { sel.length = 0; sel.push(id); }
    el.querySelectorAll("[data-aid]").forEach(x => x.setAttribute("aria-pressed", sel.includes(x.dataset.aid))); };
}

function editEntry(id) {
  const e = id ? S.diary.find(x => x.id === id) : null;
  const d = { mood: e ? e.mood : null, feelings: e ? [...(e.feelings || [])] : [], areas: e ? [...(e.areas || [])] : [] };
  openLayer(e ? "Registro" : "Novo registro", `
    ${e ? `<span class="small">${esc(fmtDay(e.at))}, ${fmtHM(e.at)}</span>` : ""}
    <div class="moods" id="d_m">${MOODS.map(m => `<button type="button" class="mood" style="--c:${m.c}" data-m="${m.v}" aria-pressed="${d.mood === m.v}"><span class="f">${m.f}</span>${m.n}</button>`).join("")}</div>
    <label>Sentimentos<div class="chips" id="d_f">${FEELINGS.map(f => `<button type="button" class="chipbtn" data-f="${f}" aria-pressed="${d.feelings.includes(f)}">${f}</button>`).join("")}</div></label>
    <label for="d_t">O que aconteceu<textarea id="d_t">${esc(e ? e.text : "")}</textarea></label>
    <label>Núcleos${areaChips(d.areas, true)}</label>
    <p class="small" id="d_msg"></p>
    ${e ? `<div class="sheetbar"><button class="btn danger" id="d_del">Apagar registro</button></div>` : ""}`, {
    okLabel: "Salvar",
    onMount: el => {
      $("#d_m", el).onclick = ev => { const b = ev.target.closest("[data-m]"); if (!b) return; d.mood = d.mood === +b.dataset.m ? null : +b.dataset.m; el.querySelectorAll("[data-m]").forEach(x => x.setAttribute("aria-pressed", +x.dataset.m === d.mood)); };
      $("#d_f", el).onclick = ev => { const b = ev.target.closest("[data-f]"); if (!b) return; const f = b.dataset.f; const i = d.feelings.indexOf(f); if (i >= 0) d.feelings.splice(i, 1); else d.feelings.push(f); b.setAttribute("aria-pressed", d.feelings.includes(f)); };
      wireChips(el, d.areas, true);
      el.querySelector("[data-ok]").onclick = () => {
        const text = $("#d_t", el).value.trim();
        if (!d.mood && !text && !d.feelings.length) { $("#d_msg", el).textContent = "Escolha como você está ou escreva algo."; return; }
        if (e) Object.assign(e, { mood: d.mood, feelings: d.feelings, areas: d.areas, text });
        else S.diary.push({ id: uid(), at: now(), mood: d.mood, feelings: d.feelings, areas: d.areas, text });
        save(); closeLayer(el); toast("Registro salvo."); renderAll(); };
      if (e) $("#d_del", el).onclick = ev => armButton(ev.currentTarget, "Toque de novo para apagar", () => { S.diary = S.diary.filter(x => x.id !== e.id); save(); closeLayer(el); renderAll(); });
    } });
}

function editTask(id) {
  const t = id ? S.tasks.find(x => x.id === id) : null;
  const d = { areas: t ? [t.areaId] : (UI.taskArea !== "all" ? [UI.taskArea] : (S.areas[0] ? [areasSorted()[0].id] : [])), weight: t ? t.weight : 2 };
  openLayer(t ? "Pendência" : "Nova pendência", `
    <label for="t_n">O que precisa ser resolvido<input id="t_n" type="text" maxlength="120" value="${esc(t ? t.title : "")}"></label>
    <label>Núcleo${areaChips(d.areas, false)}</label>
    <label>Peso<div class="seg" id="t_w">${WEIGHTS.map(([v, l]) => `<button type="button" data-w="${v}" aria-pressed="${d.weight === v}">${l}</button>`).join("")}</div></label>
    <p class="small" id="t_msg"></p>
    ${t ? `<div class="sheetbar"><button class="btn" id="t_toggle">${t.done ? "Reabrir" : "Marcar como resolvida"}</button><button class="btn danger" id="t_del">Apagar</button></div>` : ""}`, {
    okLabel: "Salvar",
    onMount: el => {
      wireChips(el, d.areas, false);
      $("#t_w", el).onclick = ev => { const b = ev.target.closest("[data-w]"); if (!b) return; d.weight = +b.dataset.w; el.querySelectorAll("[data-w]").forEach(x => x.setAttribute("aria-pressed", +x.dataset.w === d.weight)); };
      const ok = () => { const title = $("#t_n", el).value.trim(); if (!title) { $("#t_msg", el).textContent = "Escreva a pendência."; return; } if (!d.areas[0]) { $("#t_msg", el).textContent = "Escolha um núcleo."; return; }
        if (t) Object.assign(t, { title, areaId: d.areas[0], weight: d.weight }); else S.tasks.push({ id: uid(), title, areaId: d.areas[0], weight: d.weight, done: false, createdAt: now() });
        save(); closeLayer(el); renderAll(); };
      el.querySelector("[data-ok]").onclick = ok; $("#t_n", el).onkeydown = ev => { if (ev.key === "Enter") { ev.preventDefault(); ok(); } };
      if (t) { $("#t_toggle", el).onclick = () => { t.done = !t.done; t.doneAt = t.done ? now() : null; save(); closeLayer(el); renderAll(); };
        $("#t_del", el).onclick = ev => armButton(ev.currentTarget, "Toque de novo para apagar", () => { S.tasks = S.tasks.filter(x => x.id !== t.id); save(); closeLayer(el); renderAll(); }); }
    } });
}

function editHabit(id) {
  const h = id ? S.habits.find(x => x.id === id) : null;
  const d = { areas: h ? [h.areaId] : (S.areas[0] ? [areasSorted()[0].id] : []) };
  openLayer(h ? "Hábito" : "Novo hábito", `
    <label for="h_n">Hábito<input id="h_n" type="text" maxlength="60" value="${esc(h ? h.name : "")}" placeholder="Ex.: Beber 2 litros de água"></label>
    <label>Núcleo${areaChips(d.areas, false)}</label>
    <label for="h_i">Emoji (opcional)<input id="h_i" type="text" maxlength="8" value="${esc(h ? h.icon || "" : "")}" style="font-family:var(--emoji)"></label>
    <p class="small" id="h_msg"></p>
    ${h ? `<div class="sheetbar"><span></span><button class="btn danger" id="h_del">Apagar hábito</button></div>` : ""}`, {
    okLabel: "Salvar",
    onMount: el => {
      wireChips(el, d.areas, false);
      el.querySelector("[data-ok]").onclick = () => { const name = $("#h_n", el).value.trim(); if (!name) { $("#h_msg", el).textContent = "Dê um nome ao hábito."; return; } if (!d.areas[0]) { $("#h_msg", el).textContent = "Escolha um núcleo."; return; }
        const icon = $("#h_i", el).value.trim();
        if (h) Object.assign(h, { name, areaId: d.areas[0], icon }); else S.habits.push({ id: uid(), name, areaId: d.areas[0], icon, createdAt: now() });
        save(); closeLayer(el); renderAll(); };
      if (h) $("#h_del", el).onclick = ev => armButton(ev.currentTarget, "Toque de novo para apagar", () => { S.habits = S.habits.filter(x => x.id !== h.id); for (const k in S.checks) S.checks[k] = S.checks[k].filter(x => x !== h.id); save(); closeLayer(el); renderAll(); });
    } });
}

function editArea(id) {
  const a = id ? areaById(id) : null; const d = { icon: a ? a.icon : "⭐", color: a ? a.color : COLORS[S.areas.length % COLORS.length] };
  const nT = a ? S.tasks.filter(t => t.areaId === a.id).length : 0, nH = a ? S.habits.filter(h => h.areaId === a.id).length : 0;
  openLayer(a ? "Núcleo" : "Novo núcleo", `
    <label for="a_n">Nome<input id="a_n" type="text" maxlength="30" value="${esc(a ? a.name : "")}" placeholder="Ex.: Trabalho"></label>
    <label>Ícone<div class="emojis" id="a_i">${[...new Set([d.icon, ...AREA_EMOJIS])].map(e => `<button type="button" data-e="${e}" aria-pressed="${e === d.icon}">${e}</button>`).join("")}</div></label>
    <label for="a_free">Ou cole qualquer emoji<input id="a_free" type="text" maxlength="8" style="font-family:var(--emoji)"></label>
    <label>Cor<div class="swatches" id="a_c">${COLORS.map(c => `<button type="button" style="--c:${c}" data-c="${c}" aria-label="Cor ${c}" aria-pressed="${c === d.color}"></button>`).join("")}</div></label>
    <p class="small" id="a_msg">${a && (nT || nH) ? `Apagar este núcleo apaga ${nT} pendência${nT === 1 ? "" : "s"} e ${nH} hábito${nH === 1 ? "" : "s"} dele.` : ""}</p>
    ${a ? `<div class="sheetbar"><span></span><button class="btn danger" id="a_del">Apagar núcleo</button></div>` : ""}`, {
    okLabel: "Salvar",
    onMount: el => {
      $("#a_i", el).onclick = ev => { const b = ev.target.closest("[data-e]"); if (!b) return; d.icon = b.dataset.e; $("#a_free", el).value = ""; el.querySelectorAll("#a_i button").forEach(x => x.setAttribute("aria-pressed", x === b)); };
      $("#a_c", el).onclick = ev => { const b = ev.target.closest("[data-c]"); if (!b) return; d.color = b.dataset.c; el.querySelectorAll("#a_c button").forEach(x => x.setAttribute("aria-pressed", x === b)); };
      el.querySelector("[data-ok]").onclick = () => { const name = $("#a_n", el).value.trim(); if (!name) { $("#a_msg", el).textContent = "Dê um nome ao núcleo."; return; }
        const free = $("#a_free", el).value.trim(); const icon = free || d.icon;
        if (a) Object.assign(a, { name, icon, color: d.color }); else S.areas.push({ id: uid(), name, icon, color: d.color, order: S.areas.reduce((m, x) => Math.max(m, x.order + 1), 0) });
        save(); closeLayer(el); renderAll(); };
      if (a) $("#a_del", el).onclick = ev => armButton(ev.currentTarget, "Toque de novo para apagar", () => {
        const hs = S.habits.filter(h => h.areaId === a.id).map(h => h.id);
        S.areas = S.areas.filter(x => x.id !== a.id); S.tasks = S.tasks.filter(t => t.areaId !== a.id); S.habits = S.habits.filter(h => h.areaId !== a.id);
        for (const k in S.checks) S.checks[k] = S.checks[k].filter(x => !hs.includes(x)); S.diary.forEach(e => { e.areas = (e.areas || []).filter(x => x !== a.id); });
        save(); closeLayer(el); renderAll(); });
    } });
}
function openArea(id) {
  const a = areaById(id); if (!a) return; const v = areaScore(a.id), tp = taskPct(a.id), hp = habitPct(a.id);
  const tasks = S.tasks.filter(t => t.areaId === a.id && !t.done); const habits = S.habits.filter(h => h.areaId === a.id);
  const entries = S.diary.filter(e => (e.areas || []).includes(a.id)).sort((x, y) => y.at - x.at).slice(0, 5);
  openLayer(a.name, `<div class="card hero">${ringSVG(v)}<div class="facts"><span class="sub"><span class="em">${esc(a.icon)}</span> ${esc(a.name)}</span><b>${pctTxt(v)}</b><span class="sub">Pendências resolvidas ${pctTxt(tp)} · hábitos (7 dias) ${pctTxt(hp)}</span></div></div>
    <section class="section"><h2>Pendências abertas</h2>${tasks.length ? `<div class="list">${tasks.map(t => `<div class="task"><span class="box"></span><span class="tt">${esc(t.title)}</span><span></span><span class="meta"><span class="w">${"●".repeat(t.weight)}${"○".repeat(3 - t.weight)}</span></span></div>`).join("")}</div>` : `<div class="empty">Nenhuma.</div>`}</section>
    <section class="section"><h2>Hábitos</h2>${habits.length ? `<div class="chips">${habits.map(h => `<span class="tag" style="--c:${a.color}">${esc(h.icon || a.icon)} ${esc(h.name)} · 🔥 ${streak(h)}</span>`).join("")}</div>` : `<div class="empty">Nenhum.</div>`}</section>
    <section class="section"><h2>Últimos registros</h2>${entries.length ? `<div class="feed">${entries.map(e => { const m = moodOf(e.mood); return `<div class="entry" style="--c:${m ? m.c : "var(--line)"}"><span class="f">${m ? m.f : "📝"}</span><span class="t">${esc(fmtDay(e.at))} · ${fmtHM(e.at)}</span>${e.text ? `<span class="x">${esc(e.text)}</span>` : ""}</div>`; }).join("")}</div>` : `<div class="empty">Nenhum.</div>`}</section>
    <div class="sheetbar"><button class="btn" id="o_task">${ICON.plus} Pendência</button><button class="btn" id="o_edit">Editar núcleo</button></div>`, {
    left: `<button class="btn ghost" data-act="close">Fechar</button>`,
    onMount: el => { $("#o_task", el).onclick = () => { closeLayer(el); UI.taskArea = a.id; editTask(null); }; $("#o_edit", el).onclick = () => { closeLayer(el); editArea(a.id); }; } });
}

/* ---------- backup ---------- */
function exportBackup() {
  const text = JSON.stringify({ ...S, app: "prumo", exportedAt: new Date().toISOString() }, null, 1);
  try { const url = URL.createObjectURL(new Blob([text], { type: "application/json" })); const a = document.createElement("a"); a.href = url; a.download = "prumo-backup.json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); }
  catch (e) { toast("Não foi possível exportar."); }
}
function importBackup(file) {
  const fr = new FileReader();
  fr.onload = () => { let d; try { d = JSON.parse(String(fr.result)); } catch (e) { toast("Arquivo inválido."); return; } if (d.app !== "prumo" || !Array.isArray(d.areas)) { toast("Esse arquivo não é um backup do Prumo."); return; }
    openLayer("Restaurar backup", `<p>${d.areas.length} núcleos, ${(d.tasks || []).length} pendências, ${(d.habits || []).length} hábitos e ${(d.diary || []).length} registros.</p><p class="small">Restaurar substitui tudo que está neste aparelho.</p><div class="sheetbar"><span></span><button class="btn danger" id="r_go">Substituir meus dados</button></div>`, {
      onMount: el => { $("#r_go", el).onclick = ev => armButton(ev.currentTarget, "Toque de novo para confirmar", () => { S = { areas: d.areas, diary: d.diary || [], tasks: d.tasks || [], habits: d.habits || [], checks: d.checks || {}, settings: { dayEndHour: 0, ...(d.settings || {}) } }; save(); closeLayer(el); UI.tab = "home"; renderAll(); toast("Backup restaurado."); }); } }); };
  fr.readAsText(file);
}

/* ---------- eventos ---------- */
function toast(msg) { const r = $("#toastRoot"); r.innerHTML = `<div class="toast">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => { r.innerHTML = ""; }, 2600); }
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const { act, id, k } = el.dataset;
  switch (act) {
    case "tab": UI.tab = k; scrollTo(0, 0); renderAll(); break;
    case "newentry": editEntry(null); break;
    case "editentry": editEntry(id); break;
    case "newtask": editTask(null); break;
    case "edittask": editTask(id); break;
    case "tdone": { const t = S.tasks.find(x => x.id === id); if (t) { t.done = !t.done; t.doneAt = t.done ? now() : null; save(); renderAll(); if (t.done) toast("Resolvida! " + (areaById(t.areaId)?.name || "") + " agora em " + pctTxt(areaScore(t.areaId)) + "."); } break; }
    case "taskarea": UI.taskArea = k; renderAll(); break;
    case "toggledone": UI.showDone = !UI.showDone; renderAll(); break;
    case "newhabit": editHabit(null); break;
    case "edithabit": editHabit(id); break;
    case "hcheck": { const list = S.checks[k] || (S.checks[k] = []); const i = list.indexOf(id); if (i >= 0) list.splice(i, 1); else list.push(id); save(); renderAll(); break; }
    case "area": openArea(id); break;
    case "newarea": editArea(null); break;
    case "editarea": editArea(id); break;
    case "amove": { const as = areasSorted(); const i = as.findIndex(a => a.id === id); const j = i + +k; if (j < 0 || j >= as.length) break; [as[i], as[j]] = [as[j], as[i]]; as.forEach((a, n) => a.order = n); save(); renderAll(); break; }
    case "export": exportBackup(); break;
    case "close": closeLayer(el.closest(".fs")); break;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "dayEnd") { S.settings.dayEndHour = +e.target.value; save(); renderAll(); }
  if (e.target.id === "importFile" && e.target.files[0]) { importBackup(e.target.files[0]); e.target.value = ""; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#layers").children.length) closeLayer(); });

load(); renderAll();
setInterval(() => { if (!$("#layers").children.length) renderAll(); }, 60000);

/* atualização automática: ao abrir, ao voltar para a tela e a cada 5 min */
const BUILD = "20261023081155";
window.PRUMO_BUILD = (b => { if (!/^\d{14}$/.test(b)) return ""; const d = new Date(Date.UTC(+b.slice(0, 4), +b.slice(4, 6) - 1, +b.slice(6, 8), +b.slice(8, 10), +b.slice(10, 12))); return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); })(BUILD);
let swReg = null;
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(r => { swReg = r; }).catch(() => {}));
async function checkUpdate() {
  if (navigator.onLine === false) return;
  try { if (swReg) swReg.update(); } catch (e) { /* ok */ }
  let latest = null;
  try { const h = await (await fetch("./?u=" + Date.now(), { cache: "no-store" })).text(); const m = h.match(/const BUILD = "([0-9]+)"/); latest = m && m[1]; } catch (e) { return; }
  if (!latest || latest === BUILD) return;
  if ($("#layers").children.length) { setTimeout(checkUpdate, 15000); return; }
  try { if (sessionStorage.getItem("prumo.updatedTo") === latest) return; sessionStorage.setItem("prumo.updatedTo", latest); } catch (e) { /* ok */ }
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ok */ }
  toast("Atualizando o Prumo…"); setTimeout(() => location.reload(), 400);
}
setTimeout(checkUpdate, 2500);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
addEventListener("pageshow", e => { if (e.persisted) checkUpdate(); });
setInterval(checkUpdate, 5 * 60 * 1000);
</script>
</body>
